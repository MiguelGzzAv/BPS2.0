<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #ffffff;
            color: #212529;
            margin: 0;
        }
        .header {
            background-color: #007bff;
            color: #ffffff;
            padding: 1rem;
            text-align: center;
        }
        .container {
            padding: 2rem;
        }
        .welcome-message {
            background-color: #f8f9fa;
            border: 3px solid #ffc107;
            border-radius: 5px;
            padding: 2rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Dashboard</h1>
    </div>
    <div class="container">
        <div class="welcome-message">
            <h2>Welcome, Captain!</h2>
            <p>Here be the heart of yer operations. More treasures to be added soon!</p>
        </div>
    </div>
</body>
</html>
