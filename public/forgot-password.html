<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #ffffff;
            color: #212529;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 2rem;
        }
        a {
            color: #007bff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Forgot Password</h1>
        <p>Enter your email address and we'll send you a link to reset your password.</p>
        <form action="/forgot-password" method="post" style="margin-top: 1.5rem;">
            <div>
                <label for="email" style="display: block; margin-bottom: 0.5rem;">Email Address:</label>
                <input type="email" id="email" name="email" required style="width: 100%; padding: 0.5rem; border: 1px solid #dee2e6; border-radius: 3px;">
            </div>
            <div style="margin-top: 1rem;">
                <button type="submit" style="background-color: #007bff; color: white; padding: 0.7rem 1.5rem; border: none; border-radius: 3px; cursor: pointer;">Send Reset Link</button>
            </div>
        </form>
        <div style="margin-top: 1.5rem;">
            <a href="/">Back to Login</a>
        </div>
    </div>
</body>
</html>
