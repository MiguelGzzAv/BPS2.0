version: '3.8'

services:
  # PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: monitoring_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      # Expose the DB port to the host for direct access if needed
      - "${DB_PORT}:5432"
    volumes:
      # Persist database data
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Node.js Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: monitoring_server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot-reloading
      - ./server:/usr/src/app
      # Don't overwrite node_modules from the host
      - /usr/src/app/node_modules
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - DB_HOST=db # Use the service name as the host
      - DB_PORT=5432
      - NODE_ENV=development

  # Frontend React/Vite Service (in Development Mode)
  client:
    image: node:18-alpine
    container_name: monitoring_client_dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    working_dir: /app
    volumes:
      # Mount source code for hot-reloading
      - ./client:/app
      # Anonymous volume to prevent node_modules from being overwritten by the host
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      - server

volumes:
  # Named volume for persisting database data
  db-data: