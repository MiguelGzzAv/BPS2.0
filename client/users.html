<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users & Groups</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu" aria-controls="offcanvasMenu">
                Menu
            </button>
            <a class="navbar-brand" href="#">
                <img src="logo.png" alt="Avatar Logo" style="width:40px;" class="rounded-pill">
            </a>
        </div>
    </nav>
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu" aria-labelledby="offcanvasMenuLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasMenuLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav nav-pills flex-column mb-auto">
                 <li class="nav-item">
                    <a href="/dashboard.html" class="nav-link" id="menu-dashboard">Dashboard</a>
                </li>
                <li>
                    <a href="/users.html" class="nav-link text-dark" id="menu-users">Users</a>
                </li>
                <li>
                    <a href="/selection.html" class="nav-link text-dark">Companies</a>
                </li>
                <li>
                    <a href="/departments.html" class="nav-link text-dark" id="menu-departments">Departments</a>
                </li>
                <li>
                    <a href="/processes.html" class="nav-link text-dark" id="menu-processes">Processes</a>
                </li>
                <li>
                    <a href="/monitoring.html" class="nav-link text-dark" id="menu-monitoring">Monitoring</a>
                </li>
                <li>
                    <a href="/escalation.html" class="nav-link text-dark" id="menu-escalation">Escalation</a>
                </li>
                 <li>
                    <a href="/configuration.html" class="nav-link text-dark" id="menu-configuration">Configuration</a>
                </li>
            </ul>
        </div>
    </div>

    <main class="container mt-4">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1>User Management</h1>
            <button id="add-user-btn" class="btn btn-primary">Add New User</button>
        </header>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Username</th>
                    <th>Group</th>
                    <th class="actions-header">Actions</th>
                </tr>
            </thead>
            <tbody id="user-list"></tbody>
        </table>

        <hr class="my-5">

        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1>Group Management</h1>
            <button id="add-group-btn" class="btn btn-primary">Add New Group</button>
        </header>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Group Name</th>
                    <th class="actions-header">Actions</th>
                </tr>
            </thead>
            <tbody id="group-list"></tbody>
        </table>
    </main>

    <!-- Add User Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addUserModalLabel">Add New User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="add-user-form">
                        <div class="mb-3"><label for="user-name" class="form-label">Name</label><input type="text" class="form-control" id="user-name" required></div>
                        <div class="mb-3"><label for="user-email" class="form-label">Email</label><input type="email" class="form-control" id="user-email" required></div>
                        <div class="mb-3"><label for="user-phone" class="form-label">Phone</label><input type="tel" class="form-control" id="user-phone"></div>
                        <div class="mb-3"><label for="user-username" class="form-label">Username</label><input type="text" class="form-control" id="user-username" required></div>
                        <div class="mb-3"><label for="user-password" class="form-label">Password</label><input type="password" class="form-control" id="user-password" required></div>
                        <div class="mb-3"><label for="user-group" class="form-label">Group</label><select class="form-select" id="user-group" required></select></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" form="add-user-form" class="btn btn-primary">Save User</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Group Modal -->
    <div class="modal fade" id="addGroupModal" tabindex="-1" aria-labelledby="addGroupModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addGroupModalLabel">Add New Group</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="add-group-form">
                        <div class="mb-3"><label for="group-name" class="form-label">Group Name</label><input type="text" class="form-control" id="group-name" required></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" form="add-group-form" class="btn btn-primary">Save Group</button>
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userRole = window.loggedInUser ? window.loggedInUser.role : 'Reader';
            const companyId = window.loggedInUser ? window.loggedInUser.companyId : null;

            const addUserBtn = document.getElementById('add-user-btn');
            const addGroupBtn = document.getElementById('add-group-btn');
            const actionsHeaders = document.querySelectorAll('.actions-header');

            if (userRole !== 'Administrator') {
                addUserBtn.style.display = 'none';
                addGroupBtn.style.display = 'none';
                actionsHeaders.forEach(h => h.style.display = 'none');
            }

            const menu = document.getElementById('offcanvasMenu');
            const addUserModal = new bootstrap.Modal(document.getElementById('addUserModal'));
            const addUserForm = document.getElementById('add-user-form');
            const userList = document.getElementById('user-list');
            const groupSelect = document.getElementById('user-group');
            const addGroupModal = new bootstrap.Modal(document.getElementById('addGroupModal'));
            const addGroupForm = document.getElementById('add-group-form');
            const groupList = document.getElementById('group-list');

            let groupsData = [];

            const updateMenuLinks = (id) => {
                if (!id || !window.loggedInUser) return;
                menu.querySelector('#menu-dashboard').href = `/dashboard.html?companyId=${id}`;
                menu.querySelector('#menu-users').href = `/users.html?companyId=${id}`;
                menu.querySelector('#menu-departments').href = `/departments.html?companyId=${id}`;
                menu.querySelector('#menu-processes').href = `/processes.html?companyId=${id}`;
                menu.querySelector('#menu-monitoring').href = `monitoring.html?companyId=${id}`;
                menu.querySelector('#menu-escalation').href = `/escalation.html?companyId=${id}`;
                menu.querySelector('#menu-configuration').href = `/configuration.html?companyId=${id}`;

                const currentPage = window.location.pathname;
                if (currentPage.includes('users.html')) {
                    menu.querySelector('#menu-users').classList.add('active');
                }
            };

            const fetchAndRenderUsers = () => {
                if (!companyId) return;
                fetch(`/api/users?companyId=${companyId}`, { credentials: 'same-origin' })
                    .then(response => response.json())
                    .then(users => {
                        userList.innerHTML = '';
                        users.forEach(user => {
                            const group = groupsData.find(g => g.id === user.groupId) || {};
                            const row = document.createElement('tr');
                            const actionsHtml = userRole === 'Administrator' ? `
                                <td class="actions-cell">
                                    <button class="btn btn-sm btn-warning" disabled>Edit</button>
                                    <button class="btn btn-sm btn-danger" disabled>Delete</button>
                                </td>` : '';
                            row.innerHTML = `
                                <td>${user.name}</td>
                                <td>${user.email}</td>
                                <td>${user.phone}</td>
                                <td>${user.username}</td>
                                <td>${group.name || 'N/A'}</td>
                                ${actionsHtml}
                            `;
                            userList.appendChild(row);
                        });
                        if (userRole !== 'Administrator') {
                            document.querySelectorAll('.actions-cell').forEach(c => c.style.display = 'none');
                        }
                    })
                    .catch(error => console.error('Error fetching users:', error));
            };

            addUserBtn.addEventListener('click', () => {
                addUserForm.reset();
                addUserModal.show();
            });

            addUserForm.addEventListener('submit', (event) => {
                event.preventDefault();
                const selectedGroupId = document.getElementById('user-group').value;
                if (isNaN(selectedGroupId)) {
                    alert('Please select a valid group.');
                    return;
                }

                const newUser = {
                    companyId: companyId,
                    name: document.getElementById('user-name').value,
                    email: document.getElementById('user-email').value,
                    phone: document.getElementById('user-phone').value,
                    username: document.getElementById('user-username').value,
                    password: document.getElementById('user-password').value,
                    groupId: parseInt(selectedGroupId, 10)
                };

                fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newUser),
                    credentials: 'same-origin'
                })
                .then(response => {
                    if (!response.ok) throw new Error('Failed to add user');
                    return response.json();
                })
                .then(() => {
                    addUserModal.hide();
                    fetchAndRenderUsers();
                })
                .catch(error => console.error('Error adding user:', error));
            });

            const fetchAndRenderGroups = () => {
                if (!companyId) return Promise.resolve();
                return fetch(`/api/groups?companyId=${companyId}`, { credentials: 'same-origin' })
                    .then(response => response.json())
                    .then(groups => {
                        groupList.innerHTML = '';
                        groups.forEach(group => {
                            const row = document.createElement('tr');
                            const actionsHtml = userRole === 'Administrator' ? `
                                <td class="actions-cell">
                                    <button class="btn btn-sm btn-warning" disabled>Edit</button>
                                    <button class="btn btn-sm btn-danger" disabled>Delete</button>
                                </td>` : '';
                            row.innerHTML = `
                                <td>${group.name}</td>
                                ${actionsHtml}
                            `;
                            groupList.appendChild(row);
                        });
                        groupsData = groups;
                        groupSelect.innerHTML = '<option selected>Choose...</option>';
                        groups.forEach(group => {
                            const option = document.createElement('option');
                            option.value = group.id;
                            option.textContent = group.name;
                            groupSelect.appendChild(option);
                        });
                        if (userRole !== 'Administrator') {
                            document.querySelectorAll('.actions-cell').forEach(c => c.style.display = 'none');
                        }
                    })
                    .catch(error => console.error('Error fetching groups:', error));
            };

            addGroupBtn.addEventListener('click', () => {
                addGroupForm.reset();
                addGroupModal.show();
            });

            addGroupForm.addEventListener('submit', (event) => {
                event.preventDefault();
                const newGroup = {
                    companyId: companyId,
                    name: document.getElementById('group-name').value,
                };

                fetch('/api/groups', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newGroup),
                    credentials: 'same-origin'
                })
                .then(response => {
                    if (!response.ok) throw new Error('Failed to add group');
                    return response.json();
                })
                .then(() => {
                    addGroupModal.hide();
                    fetchAndRenderGroups();
                })
                .catch(error => console.error('Error adding group:', error));
            });

            updateMenuLinks(companyId);
            fetchAndRenderGroups().then(() => {
                fetchAndRenderUsers();
            });
        });
    </script>
</body>
</html>
