<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu">Menu</button>
            <a class="navbar-brand ms-3" href="#">
                <img src="logo.png" alt="Avatar Logo" style="width:40px;" class="rounded-pill">
            </a>
            <div class="ms-auto">
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </nav>
    <!-- Offcanvas Menu -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu">
        <div class="offcanvas-header"><h5 class="offcanvas-title">Menu</h5><button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button></div>
        <div class="offcanvas-body">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item"><a href="#" class="nav-link text-dark" id="menu-dashboard">Dashboard</a></li>
                <li><a href="#" class="nav-link" id="menu-users">Users</a></li>
                <li><a href="/selection.html" class="nav-link text-dark">Companies</a></li>
                <li><a href="#" class="nav-link text-dark" id="menu-departments">Departments</a></li>
                <li><a href="#" class="nav-link text-dark" id="menu-processes">Processes</a></li>
                <li><a href="#" class="nav-link text-dark" id="menu-monitoring">Monitoring</a></li>
                <li><a href="#" class="nav-link text-dark" id="menu-escalation">Escalation</a></li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container mt-4">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1 id="header-title">User Management</h1>
            <button id="add-user-btn" class="btn btn-primary" style="display: none;">Add User</button>
        </header>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Username</th>
                    <th>Role</th>
                    <th id="company-header-cell" style="display: none;">Company</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="user-list">
                <!-- User rows injected by JS -->
            </tbody>
        </table>
    </main>

    <!-- Add User Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Add New User</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="add-user-form">
                        <div class="mb-3" id="company-select-container" style="display: none;">
                            <label for="user-company" class="form-label">Company</label>
                            <select id="user-company" class="form-select"></select>
                        </div>
                        <div class="mb-3">
                            <label for="user-name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="user-name" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label for="user-email" class="form-label">Email</label><input type="email" class="form-control" id="user-email" required></div>
                            <div class="col-md-6 mb-3"><label for="user-phone" class="form-label">Phone</label><input type="tel" class="form-control" id="user-phone"></div>
                        </div>
                        <hr>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label for="user-username" class="form-label">Username</label><input type="text" class="form-control" id="user-username" required></div>
                            <div class="col-md-6 mb-3"><label for="user-password" class="form-label">Password</label><input type="password" class="form-control" id="user-password" required></div>
                        </div>
                        <div class="mb-3">
                            <label for="user-role" class="form-label">Role</label>
                            <select id="user-role" class="form-select" required></select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" form="add-user-form" class="btn btn-primary">Save User</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            protectPage();
            const user = getLoggedInUser();
            const companyId = sessionStorage.getItem('selectedCompanyId');
            const companyName = sessionStorage.getItem('selectedCompanyName');

            if (!companyId && user.role !== 'superadmin') {
                alert('No company selected. Redirecting...');
                window.location.href = '/selection.html';
                return;
            }

            // --- Elements ---
            const userList = document.getElementById('user-list');
            const addUserBtn = document.getElementById('add-user-btn');
            const addUserForm = document.getElementById('add-user-form');
            const logoutBtn = document.getElementById('logout-btn');
            const addUserModal = new bootstrap.Modal(document.getElementById('addUserModal'));
            const companyHeaderCell = document.getElementById('company-header-cell');

            // --- UI Setup ---
            document.getElementById('header-title').textContent = user.role === 'superadmin' ? 'User Management (All Companies)' : `User Management - ${companyName}`;
            logoutBtn.addEventListener('click', logout);

            if (user.role === 'admin' || user.role === 'superadmin') {
                addUserBtn.style.display = 'block';
            }
            if (user.role === 'superadmin') {
                companyHeaderCell.style.display = 'table-cell';
            }

            const updateMenuLinks = () => {
                if (user.role === 'superadmin') return; // Superadmin doesn't need company-specific links
                const menu = document.getElementById('offcanvasMenu');
                menu.querySelector('#menu-dashboard').href = `dashboard.html`;
                menu.querySelector('#menu-users').href = `users.html`;
                menu.querySelector('#menu-departments').href = `departments.html`;
                menu.querySelector('#menu-processes').href = `processes.html`;
                menu.querySelector('#menu-monitoring').href = `monitoring.html`;
                menu.querySelector('#menu-escalation').href = `escalation.html`;
                menu.querySelector('#menu-users').classList.add('active');
            };

            // --- Data Functions ---
            const renderUsers = (users) => {
                userList.innerHTML = '';
                if (!users || users.length === 0) {
                    userList.innerHTML = '<tr><td colspan="6">No users found.</td></tr>';
                    return;
                }
                users.forEach(u => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${u.name}</td>
                        <td>${u.email || ''}</td>
                        <td>${u.username}</td>
                        <td>${u.role}</td>
                        ${user.role === 'superadmin' ? `<td>${u.companyName || 'N/A'}</td>` : ''}
                        <td>
                            <button class="btn btn-sm btn-warning" disabled>Edit</button>
                            <button class="btn btn-sm btn-danger" disabled>Delete</button>
                        </td>
                    `;
                    userList.appendChild(row);
                });
            };

            const fetchAndRenderUsers = async () => {
                let url = '/api/users';
                // For admins, the backend filters by their company. Superadmin gets all.
                // If a superadmin is viewing a specific company dashboard, we could filter here,
                // but for a global user view, we fetch all.
                if (user.role === 'admin') {
                    url += `?companyId=${companyId}`; // Still useful for clarity, though backend enforces it
                }
                try {
                    const response = await fetchWithAuth(url);
                    const users = await response.json();
                    renderUsers(users);
                } catch (error) {
                    console.error('Error fetching users:', error);
                    userList.innerHTML = '<tr><td colspan="6" class="text-danger">Error loading users.</td></tr>';
                }
            };

            const populateAddUserModal = async () => {
                const roleSelect = document.getElementById('user-role');
                roleSelect.innerHTML = '';

                const availableRoles = {
                    superadmin: ['admin', 'operator', 'reader', 'superadmin'],
                    admin: ['operator', 'reader']
                };

                (availableRoles[user.role] || []).forEach(role => {
                    roleSelect.innerHTML += `<option value="${role}">${role}</option>`;
                });

                if (user.role === 'superadmin') {
                    document.getElementById('company-select-container').style.display = 'block';
                    const companySelect = document.getElementById('user-company');
                    try {
                        const response = await fetchWithAuth('/api/companies');
                        const companies = await response.json();
                        companySelect.innerHTML = companies.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                    } catch (error) {
                       console.error('Failed to load companies for modal', error);
                    }
                }
            };

            // --- Event Listeners ---
            addUserBtn.addEventListener('click', async () => {
                addUserForm.reset();
                await populateAddUserModal();
                addUserModal.show();
            });

            addUserForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                const newUser = {
                    name: document.getElementById('user-name').value,
                    email: document.getElementById('user-email').value,
                    phone: document.getElementById('user-phone').value,
                    username: document.getElementById('user-username').value,
                    password: document.getElementById('user-password').value,
                    role: document.getElementById('user-role').value
                };

                if (user.role === 'superadmin') {
                    newUser.companyId = document.getElementById('user-company').value;
                }

                try {
                    await fetchWithAuth('/api/users', {
                        method: 'POST',
                        body: JSON.stringify(newUser)
                    });
                    addUserModal.hide();
                    fetchAndRenderUsers();
                } catch (error) {
                    console.error('Error adding user:', error);
                    alert('Failed to add user.');
                }
            });

            // --- Initial Load ---
            updateMenuLinks();
            fetchAndRenderUsers();
        });
    </script>
</body>
</html>
