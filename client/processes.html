<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Main Content -->
    <main class="container mt-4">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1>Process Definition</h1>
            <button id="add-process-btn" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProcessModal">
                Add New Process
            </button>
        </header>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Organization</th>
                    <th>Business Area</th>
                    <th>Frequency</th>
                    <th>Process Type</th>
                </tr>
            </thead>
            <tbody id="process-list">
                <!-- Process rows will be inserted here -->
            </tbody>
        </table>
    </main>

    <!-- Add Process Modal -->
    <div class="modal fade" id="addProcessModal" tabindex="-1" aria-labelledby="addProcessModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addProcessModalLabel">Add New Process</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="add-process-form">
                        <div class="mb-3">
                            <label for="process-id" class="form-label">Process ID</label>
                            <input type="text" class="form-control" id="process-id" required>
                        </div>
                        <div class="mb-3">
                            <label for="process-name" class="form-label">Process Name</label>
                            <input type="text" class="form-control" id="process-name" required>
                        </div>
                        <div class="mb-3">
                            <label for="process-organization" class="form-label">Organization</label>
                            <input type="text" class="form-control" id="process-organization">
                        </div>
                        <div class="mb-3">
                            <label for="process-businessArea" class="form-label">Business Area</label>
                            <input type="text" class="form-control" id="process-businessArea">
                        </div>
                        <div class="mb-3">
                            <label for="process-frequency" class="form-label">Frequency</label>
                            <select class="form-select" id="process-frequency">
                                <option selected>Choose...</option>
                                <option value="Diario">Diario</option>
                                <option value="Personalizado">Personalizado</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="process-processType" class="form-label">Process Type</label>
                            <select class="form-select" id="process-processType">
                                <option selected>Choose...</option>
                                <option value="Padre">Padre</option>
                                <option value="Hijo">Hijo</option>
                                <option value="Nieto">Nieto</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" form="add-process-form" class="btn btn-primary">Save Process</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const processList = document.getElementById('process-list');
            const addProcessModalEl = document.getElementById('addProcessModal');
            const addProcessModal = new bootstrap.Modal(addProcessModalEl);
            const addProcessForm = document.getElementById('add-process-form');

            const renderProcesses = (processes) => {
                processList.innerHTML = '';
                processes.forEach(proc => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${proc.id}</td>
                        <td>${proc.name}</td>
                        <td>${proc.organization}</td>
                        <td>${proc.businessArea}</td>
                        <td>${proc.frequency}</td>
                        <td>${proc.processType}</td>
                    `;
                    processList.appendChild(row);
                });
            };

            const fetchAndRenderProcesses = () => {
                fetch('/api/processes')
                    .then(response => response.json())
                    .then(renderProcesses)
                    .catch(error => console.error('Error fetching processes:', error));
            };

            addProcessForm.addEventListener('submit', (event) => {
                event.preventDefault();
                const newProcess = {
                    id: document.getElementById('process-id').value,
                    name: document.getElementById('process-name').value,
                    organization: document.getElementById('process-organization').value,
                    businessArea: document.getElementById('process-businessArea').value,
                    frequency: document.getElementById('process-frequency').value,
                    processType: document.getElementById('process-processType').value,
                    values: [],
                    subprocesses: []
                };

                fetch('/api/processes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newProcess)
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to add process');
                    }
                    return response.json();
                })
                .then(() => {
                    addProcessForm.reset();
                    addProcessModal.hide();
                    fetchAndRenderProcesses();
                })
                .catch(error => console.error('Error adding process:', error));
            });

            // Initial load
            fetchAndRenderProcesses();
        });
    </script>
</body>
</html>
