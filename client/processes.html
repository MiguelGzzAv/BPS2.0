<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu">Menu</button>
            <a class="navbar-brand ms-3" href="#"><img src="logo.png" alt="Avatar Logo" style="width:40px;" class="rounded-pill"></a>
            <div class="ms-auto"><button id="logout-btn" class="btn btn-secondary">Logout</button></div>
        </div>
    </nav>
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu">
        <div class="offcanvas-header"><h5 class="offcanvas-title">Menu</h5><button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button></div>
        <div class="offcanvas-body">
            <ul class="nav nav-pills flex-column mb-auto">
                <li><a href="#" class="nav-link text-dark" id="menu-dashboard">Dashboard</a></li>
                <li><a href="#" class="nav-link text-dark" id="menu-users">Users</a></li>
                <li><a href="/selection.html" class="nav-link text-dark">Companies</a></li>
                <li><a href="#" class="nav-link text-dark" id="menu-departments">Departments</a></li>
                <li><a href="#" class="nav-link" id="menu-processes">Processes</a></li>
                <li><a href="#" class="nav-link text-dark" id="menu-monitoring">Monitoring</a></li>
                <li><a href="#" class="nav-link text-dark" id="menu-escalation">Escalation</a></li>
            </ul>
        </div>
    </div>

    <main class="container mt-4">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1 id="header-title">Process Definition</h1>
            <button id="add-process-btn" class="btn btn-primary" style="display: none;">Add New Process</button>
        </header>
        <table class="table table-striped">
            <thead>
                <tr><th>ID</th><th>Name</th><th>Mode</th><th>Criticidad</th><th>Frequency</th><th>Actions</th></tr>
            </thead>
            <tbody id="process-list"></tbody>
        </table>
    </main>

    <div class="modal fade" id="processModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="processModalLabel">Process</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="process-form">
                        <div class="row">
                            <div class="col-md-6 mb-3"><label for="process-id" class="form-label">Process ID</label><input type="text" class="form-control" id="process-id" required></div>
                            <div class="col-md-6 mb-3"><label for="process-name" class="form-label">Process Name</label><input type="text" class="form-control" id="process-name" required></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label for="process-criticidad" class="form-label">Criticidad</label><select class="form-select" id="process-criticidad"><option value="Baja">Baja</option><option value="Media">Media</option><option value="Alta">Alta</option></select></div>
                            <div class="col-md-6 mb-3"><label for="process-mode" class="form-label">Process Mode</label><select class="form-select" id="process-mode"><option value="Individual">Individual</option><option value="Multiple">Multiple Internal Phases</option></select></div>
                        </div>
                        <hr>
                        <h5>Child Processes</h5>
                        <div id="linked-children-container" class="mb-3"></div>
                        <button type="button" class="btn btn-outline-success btn-sm" id="link-child-btn">+ Link Child</button>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" form="process-form" class="btn btn-primary">Save Process</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="linkChildProcessModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Link Child Processes</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="link-child-modal-body"></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="button" id="save-linked-children-btn" class="btn btn-primary">Save Links</button></div></div></div></div>
    <div class="modal fade" id="deleteProcessModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Confirm Deletion</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">Are you sure?</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="button" id="confirm-delete-btn" class="btn btn-danger">Delete</button></div></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        protectPage();
        const user = getLoggedInUser();
        const companyId = sessionStorage.getItem('selectedCompanyId');
        const companyName = sessionStorage.getItem('selectedCompanyName');

        if (!companyId) {
            alert('No company selected. Redirecting...');
            window.location.href = '/selection.html';
            return;
        }

        const canEdit = user.role === 'admin' || user.role === 'superadmin';

        // --- Elements ---
        const processList = document.getElementById('process-list');
        const processModal = new bootstrap.Modal(document.getElementById('processModal'));
        const deleteModal = new bootstrap.Modal(document.getElementById('deleteProcessModal'));
        const linkChildModal = new bootstrap.Modal(document.getElementById('linkChildProcessModal'));
        const processForm = document.getElementById('process-form');
        const logoutBtn = document.getElementById('logout-btn');
        const addProcessBtn = document.getElementById('add-process-btn');
        const linkedChildrenContainer = document.getElementById('linked-children-container');

        let currentProcessId = null;
        let isEditMode = false;
        let masterProcessList = [];
        let linkedChildren = [];

        // --- UI Setup ---
        document.getElementById('header-title').textContent = `Processes - ${companyName}`;
        logoutBtn.addEventListener('click', logout);
        if (canEdit) addProcessBtn.style.display = 'block';

        const updateMenuLinks = () => {
            const menu = document.getElementById('offcanvasMenu');
            menu.querySelector('#menu-dashboard').href = `dashboard.html`;
            menu.querySelector('#menu-users').href = `users.html`;
            menu.querySelector('#menu-departments').href = `departments.html`;
            menu.querySelector('#menu-processes').href = `processes.html`;
            menu.querySelector('#menu-monitoring').href = `monitoring.html`;
            menu.querySelector('#menu-escalation').href = `escalation.html`;
            menu.querySelector('#menu-processes').classList.add('active');
        };

        // --- Render Functions ---
        const renderProcesses = (processes) => {
            masterProcessList = processes;
            processList.innerHTML = '';
            processes.forEach(proc => {
                const row = document.createElement('tr');
                const criticidad = proc.criticidad || 'Baja';
                let badgeClass = criticidad === 'Alta' ? 'bg-danger' : (criticidad === 'Media' ? 'bg-warning text-dark' : 'bg-secondary');
                row.innerHTML = `
                    <td>${proc.id}</td>
                    <td>${proc.name}</td>
                    <td>${proc.mode || 'Individual'}</td>
                    <td><span class="badge ${badgeClass}">${criticidad}</span></td>
                    <td>${proc.frequency || ''}</td>
                    <td>
                        ${canEdit ? `<button class="btn btn-sm btn-warning edit-btn" data-id="${proc.id}">Edit</button>
                                     <button class="btn btn-sm btn-danger delete-btn" data-id="${proc.id}">Delete</button>` : 'No actions'}
                    </td>`;
                processList.appendChild(row);
            });
        };

        const fetchAndRenderProcesses = async () => {
            const url = user.role === 'superadmin' ? `/api/processes?companyId=${companyId}` : '/api/processes';
            try {
                const response = await fetchWithAuth(url);
                renderProcesses(await response.json());
            } catch (error) {
                console.error('Error fetching processes:', error);
                processList.innerHTML = '<tr><td colspan="6" class="text-danger">Error loading processes.</td></tr>';
            }
        };

        const renderLinkedChildren = () => {
            linkedChildrenContainer.innerHTML = linkedChildren.length === 0 ? '<p class="text-muted">No child processes linked.</p>' :
                linkedChildren.map(child => {
                    const process = masterProcessList.find(p => p.id === child.id);
                    return `<div class="d-flex justify-content-between align-items-center border-bottom py-2">
                        <span>${process ? `${process.name} (${process.id})` : `Unknown (${child.id})`}</span>
                        <div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" data-child-id="${child.id}" ${child.dependency ? 'checked' : ''}>
                                <label class="form-check-label">Dependency</label>
                            </div>
                            <button type="button" class="btn btn-danger btn-sm remove-child-btn" data-child-id="${child.id}">X</button>
                        </div>
                    </div>`;
                }).join('');
        };

        // --- Form & Modal Logic ---
        const prepareModal = (process = null) => {
            processForm.reset();
            isEditMode = !!process;
            currentProcessId = process ? process.id : null;
            document.getElementById('process-id').disabled = isEditMode;
            document.getElementById('processModalLabel').textContent = isEditMode ? 'Edit Process' : 'Add New Process';

            if (process) {
                document.getElementById('process-id').value = process.id;
                document.getElementById('process-name').value = process.name;
                document.getElementById('process-criticidad').value = process.criticidad || 'Baja';
                document.getElementById('process-mode').value = process.mode || 'Individual';
                linkedChildren = [...(process.childProcesses || [])];
            } else {
                linkedChildren = [];
            }
            renderLinkedChildren();
            processModal.show();
        };

        processForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const processData = {
                id: document.getElementById('process-id').value,
                name: document.getElementById('process-name').value,
                criticidad: document.getElementById('process-criticidad').value,
                mode: document.getElementById('process-mode').value,
                childProcesses: linkedChildren
            };

            const url = isEditMode ? `/api/processes/${currentProcessId}` : '/api/processes';
            const method = isEditMode ? 'PUT' : 'POST';

            const body = { processData };
            if (user.role === 'superadmin') {
                body.companyId = companyId;
            }

            try {
                await fetchWithAuth(url, { method, body: JSON.stringify(body) });
                processModal.hide();
                fetchAndRenderProcesses();
            } catch (err) {
                console.error('Error saving process:', err);
                alert('Failed to save process.');
            }
        });

        // --- Event Delegation ---
        document.body.addEventListener('click', (e) => {
            const target = e.target;
            const processId = target.dataset.id;

            if (target.matches('.edit-btn')) {
                prepareModal(masterProcessList.find(p => p.id === processId));
            } else if (target.matches('.delete-btn')) {
                currentProcessId = processId;
                deleteModal.show();
            } else if (target.id === 'add-process-btn') {
                prepareModal();
            } else if (target.id === 'confirm-delete-btn') {
                const url = user.role === 'superadmin' ? `/api/processes/${currentProcessId}?companyId=${companyId}` : `/api/processes/${currentProcessId}`;
                fetchWithAuth(url, { method: 'DELETE' })
                    .then(() => {
                        deleteModal.hide();
                        fetchAndRenderProcesses();
                    })
                    .catch(err => console.error('Error deleting process:', err));
            } else if (target.id === 'link-child-btn') {
                const modalBody = document.getElementById('link-child-modal-body');
                modalBody.innerHTML = masterProcessList
                    .filter(p => p.id !== currentProcessId)
                    .map(p => `<div class="form-check"><input class="form-check-input" type="checkbox" value="${p.id}" id="child-link-${p.id}" ${linkedChildren.some(c => c.id === p.id) ? 'checked' : ''}><label class="form-check-label" for="child-link-${p.id}">${p.name}</label></div>`)
                    .join('');
                linkChildModal.show();
            } else if (target.id === 'save-linked-children-btn') {
                linkedChildren = Array.from(document.querySelectorAll('#link-child-modal-body input:checked'))
                    .map(input => ({ id: input.value, dependency: linkedChildren.find(c => c.id === input.value)?.dependency || false }));
                renderLinkedChildren();
                linkChildModal.hide();
            } else if (target.matches('.remove-child-btn')) {
                linkedChildren = linkedChildren.filter(c => c.id !== target.dataset.childId);
                renderLinkedChildren();
            } else if (target.matches('#linked-children-container input[type="checkbox"]')) {
                const child = linkedChildren.find(c => c.id === target.dataset.childId);
                if (child) child.dependency = target.checked;
            }
        });

        // --- Initial Load ---
        updateMenuLinks();
        fetchAndRenderProcesses();
    });
    </script>
</body>
</html>
