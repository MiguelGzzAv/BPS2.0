<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Selection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="logo.png" alt="Avatar Logo" style="width:40px;" class="rounded-pill">
            </a>
            <div class="ms-auto">
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </nav>
    <main class="container mt-4">
        <div class="p-5 mb-4 bg-light rounded-3">
            <div class="container-fluid py-5">
                <h1 id="welcome-header" class="display-5 fw-bold">Welcome!</h1>
                <p class="col-md-8 fs-4">Please select a company to manage.</p>
            </div>
        </div>
        <hr>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Companies</h2>
            <div id="admin-controls" style="display: none;">
                <button id="add-company-btn" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addCompanyModal">Add</button>
                <button id="edit-company-btn" class="btn btn-warning" disabled>Edit</button>
                <button id="delete-company-btn" class="btn btn-danger" disabled>Delete</button>
            </div>
        </div>
        <div id="company-list" class="row"></div>
    </main>

    <div class="modal fade" id="addCompanyModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Add New Company</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="add-company-form"><input type="text" class="form-control" id="company-name" placeholder="Company Name" required></form></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button><button type="submit" form="add-company-form" class="btn btn-primary">Save</button></div></div></div>
    </div>
    <div class="modal fade" id="editCompanyModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Edit Company</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="edit-company-form"><input type="text" class="form-control" id="edit-company-name" required></form></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button><button type="submit" form="edit-company-form" class="btn btn-primary">Save Changes</button></div></div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            protectPage();
            const user = getLoggedInUser();
            const welcomeHeader = document.getElementById('welcome-header');
            const adminControls = document.getElementById('admin-controls');
            const companyList = document.getElementById('company-list');
            const editBtn = document.getElementById('edit-company-btn');
            const deleteBtn = document.getElementById('delete-company-btn');
            const addCompanyForm = document.getElementById('add-company-form');
            const editCompanyForm = document.getElementById('edit-company-form');
            const logoutBtn = document.getElementById('logout-btn');
            const addCompanyModal = new bootstrap.Modal(document.getElementById('addCompanyModal'));
            const editCompanyModal = new bootstrap.Modal(document.getElementById('editCompanyModal'));
            let selectedCompanyId = null;
            let companiesData = [];

            welcomeHeader.textContent = `Welcome, ${user.name}!`;
            if (user.role === 'superadmin') {
                adminControls.style.display = 'block';
            }
            logoutBtn.addEventListener('click', logout);

            const renderCompanies = (companies) => {
                companiesData = companies;
                companyList.innerHTML = companies.map(company => `
                    <div class="col-md-4 mb-4">
                        <div class="card" data-id="${company.id}" data-name="${company.name}">
                            <div class="card-body">
                                <h5 class="card-title">${company.name}</h5>
                                <button class="btn btn-primary btn-sm access-btn mt-2">Access Dashboard</button>
                            </div>
                        </div>
                    </div>`).join('');
            };

            const fetchAndRenderCompanies = async () => {
                try {
                    const response = await fetchWithAuth('/api/companies');
                    renderCompanies(await response.json());
                } catch (error) {
                    console.error('Error fetching companies:', error);
                    alert('Could not fetch companies.');
                }
            };

            companyList.addEventListener('click', (event) => {
                const card = event.target.closest('.card');
                if (!card) return;

                // Handle access button click
                if (event.target.classList.contains('access-btn')) {
                    sessionStorage.setItem('selectedCompanyId', card.dataset.id);
                    sessionStorage.setItem('selectedCompanyName', card.dataset.name);
                    window.location.href = '/dashboard.html';
                    return;
                }

                // Handle card selection for admins
                if (user.role === 'superadmin') {
                    document.querySelectorAll('#company-list .card').forEach(c => c.classList.remove('border-primary'));
                    card.classList.add('border-primary');
                    selectedCompanyId = parseInt(card.dataset.id);
                    editBtn.disabled = false;
                    deleteBtn.disabled = false;
                }
            });

            addCompanyForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                const companyName = document.getElementById('company-name').value.trim();
                if (!companyName) return;
                try {
                    await fetchWithAuth('/api/companies', { method: 'POST', body: JSON.stringify({ name: companyName }) });
                    addCompanyModal.hide();
                    fetchAndRenderCompanies();
                } catch (error) {
                    console.error('Error adding company:', error);
                    alert('Failed to add company.');
                }
            });

            deleteBtn.addEventListener('click', async () => {
                if (!selectedCompanyId || !confirm('Are you sure?')) return;
                try {
                    await fetchWithAuth(`/api/companies/${selectedCompanyId}`, { method: 'DELETE' });
                    selectedCompanyId = null;
                    editBtn.disabled = true;
                    deleteBtn.disabled = true;
                    fetchAndRenderCompanies();
                } catch (error) {
                    console.error('Error deleting company:', error);
                    alert('Failed to delete company.');
                }
            });

            editBtn.addEventListener('click', () => {
                if (!selectedCompanyId) return;
                const company = companiesData.find(c => c.id === selectedCompanyId);
                if (company) {
                    document.getElementById('edit-company-name').value = company.name;
                    editCompanyModal.show();
                }
            });

            editCompanyForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                const newName = document.getElementById('edit-company-name').value.trim();
                if (!newName || !selectedCompanyId) return;
                try {
                    await fetchWithAuth(`/api/companies/${selectedCompanyId}`, { method: 'PUT', body: JSON.stringify({ name: newName }) });
                    editCompanyModal.hide();
                    fetchAndRenderCompanies();
                } catch (error) {
                    console.error('Error updating company:', error);
                    alert('Failed to update company.');
                }
            });

            fetchAndRenderCompanies();
        });
    </script>
</body>
</html>
