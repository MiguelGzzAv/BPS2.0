<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Selection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="logo.png" alt="Avatar Logo" style="width:40px;" class="rounded-pill">
            </a>
        </div>
    </nav>
    <!-- Main Content -->
    <main class="container mt-4">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1>Company Selection</h1>
        </header>

        <div class="p-5 mb-4 bg-light rounded-3">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold">Welcome, Captain!</h1>
                <p class="col-md-8 fs-4">This is your new dashboard. Use the menu to navigate through the different sections of the application.</p>
            </div>
        </div>

        <hr>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Companies</h2>
            <div>
                <button id="add-company-btn" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addCompanyModal">Add</button>
                <button id="edit-company-btn" class="btn btn-warning" disabled>Edit</button>
                <button id="delete-company-btn" class="btn btn-danger" disabled>Delete</button>
            </div>
        </div>
        <div id="company-list" class="row">
            <!-- Company cards will be inserted here by JavaScript -->
        </div>
    </main>

    <!-- Add Company Modal -->
    <div class="modal fade" id="addCompanyModal" tabindex="-1" aria-labelledby="addCompanyModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addCompanyModalLabel">Add New Company</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="add-company-form">
                        <div class="mb-3">
                            <label for="company-name" class="form-label">Company Name</label>
                            <input type="text" class="form-control" id="company-name" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" form="add-company-form" class="btn btn-primary">Save Company</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Company Modal -->
    <div class="modal fade" id="editCompanyModal" tabindex="-1" aria-labelledby="editCompanyModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editCompanyModalLabel">Edit Company</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-company-form">
                        <div class="mb-3">
                            <label for="edit-company-name" class="form-label">Company Name</label>
                            <input type="text" class="form-control" id="edit-company-name" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" form="edit-company-form" class="btn btn-primary">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Access Confirmation Modal -->
    <div class="modal fade" id="accessCompanyModal" tabindex="-1" aria-labelledby="accessCompanyModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="accessCompanyModalLabel">Access Company</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to access the company: <strong id="company-name-to-access"></strong>?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="confirm-access-btn" class="btn btn-primary">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Elements
            const companyList = document.getElementById('company-list');
            const editBtn = document.getElementById('edit-company-btn');
            const deleteBtn = document.getElementById('delete-company-btn');
            const addCompanyBtn = document.getElementById('add-company-btn');

            const addCompanyModalEl = document.getElementById('addCompanyModal');
            const addCompanyModal = new bootstrap.Modal(addCompanyModalEl);
            const addCompanyForm = document.getElementById('add-company-form');
            const companyNameInput = document.getElementById('company-name');

            const editCompanyModalEl = document.getElementById('editCompanyModal');
            const editCompanyModal = new bootstrap.Modal(editCompanyModalEl);
            const editCompanyForm = document.getElementById('edit-company-form');
            const editCompanyNameInput = document.getElementById('edit-company-name');

            const accessCompanyModalEl = document.getElementById('accessCompanyModal');
            const accessCompanyModal = new bootstrap.Modal(accessCompanyModalEl);
            const companyNameToAccess = document.getElementById('company-name-to-access');
            const confirmAccessBtn = document.getElementById('confirm-access-btn');

            let selectedCompanyId = null;
            let companiesData = [];

            // Renders the list of companies
            const renderCompanies = (companies) => {
                companiesData = companies; // Store company data locally
                companyList.innerHTML = ''; // Clear existing content
                companies.forEach(company => {
                    const companyCard = document.createElement('div');
                    companyCard.className = 'col-md-4 mb-4';
                    companyCard.innerHTML = `
                        <div class="card" style="cursor: pointer;" data-id="${company.id}">
                            <div class="card-body">
                                <h5 class="card-title">${company.name}</h5>
                            </div>
                        </div>
                    `;
                    companyList.appendChild(companyCard);

                    // Add click listener for selection
                    companyCard.querySelector('.card').addEventListener('click', (event) => {
                        // Remove active state from all other cards
                        document.querySelectorAll('#company-list .card').forEach(card => {
                            card.classList.remove('border-primary');
                        });
                        // Add active state to the clicked card
                        const selectedCard = event.currentTarget;
                        selectedCard.classList.add('border-primary');
                        selectedCompanyId = company.id;

                        // Enable Edit and Delete buttons
                        editBtn.disabled = false;
                        deleteBtn.disabled = false;

                        // Show confirmation modal
                        companyNameToAccess.textContent = company.name;
                        accessCompanyModal.show();
                    });
                });
            };

            // Fetches companies and renders them
            const fetchAndRenderCompanies = () => {
                fetch('/api/companies')
                    .then(response => response.json())
                    .then(renderCompanies)
                    .catch(error => console.error('Error fetching companies:', error));
            };

            confirmAccessBtn.addEventListener('click', () => {
                if (selectedCompanyId) {
                    window.location.href = `/dashboard.html?companyId=${selectedCompanyId}`;
                }
            });

            // Event Listeners
            addCompanyBtn.addEventListener('click', () => {
                addCompanyForm.reset();
                addCompanyModal.show();
            });

            addCompanyForm.addEventListener('submit', (event) => {
                event.preventDefault();
                const companyName = companyNameInput.value.trim();
                if (!companyName) return;

                fetch('/api/companies', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: companyName })
                })
                .then(response => response.json())
                .then(newCompany => {
                    console.log('Company added:', newCompany);
                    addCompanyModal.hide();
                    fetchAndRenderCompanies(); // Refresh the list
                })
                .catch(error => console.error('Error adding company:', error));
            });

            deleteBtn.addEventListener('click', () => {
                if (!selectedCompanyId) {
                    alert('Please select a company to delete.');
                    return;
                }

                if (confirm('Are you sure you want to delete this company?')) {
                    fetch(`/api/companies/${selectedCompanyId}`, {
                        method: 'DELETE'
                    })
                    .then(response => {
                        if (response.ok) {
                            console.log('Company deleted:', selectedCompanyId);
                            selectedCompanyId = null;
                            editBtn.disabled = true;
                            deleteBtn.disabled = true;
                            fetchAndRenderCompanies(); // Refresh the list
                        } else {
                            alert('Failed to delete company.');
                        }
                    })
                    .catch(error => console.error('Error deleting company:', error));
                }
            });

            editBtn.addEventListener('click', () => {
                if (!selectedCompanyId) {
                    alert('Please select a company to edit.');
                    return;
                }
                const companyToEdit = companiesData.find(c => c.id === selectedCompanyId);
                if (companyToEdit) {
                    editCompanyNameInput.value = companyToEdit.name;
                    editCompanyModal.show();
                }
            });

            editCompanyForm.addEventListener('submit', (event) => {
                event.preventDefault();
                const newName = editCompanyNameInput.value.trim();
                if (!newName || !selectedCompanyId) return;

                fetch(`/api/companies/${selectedCompanyId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: newName })
                })
                .then(response => response.json())
                .then(updatedCompany => {
                    console.log('Company updated:', updatedCompany);
                    editCompanyModal.hide();
                    selectedCompanyId = null;
                    editBtn.disabled = true;
                    deleteBtn.disabled = true;
                    fetchAndRenderCompanies(); // Refresh the list
                })
                .catch(error => console.error('Error updating company:', error));
            });

            // Initial load
            fetchAndRenderCompanies();
        });
    </script>
</body>
</html>
