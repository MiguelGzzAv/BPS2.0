<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Proceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .form-table-header {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        .form-table .col {
            padding: 0.5rem;
        }
        .form-control-sm {
            padding: 0.25rem 0.5rem;
            font-size: .875rem;
        }
    </style>
</head>
<body>

    <!-- Offcanvas Menu -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu" aria-labelledby="offcanvasMenuLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasMenuLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item"><a href="/dashboard.html" class="nav-link text-dark" id="menu-dashboard">Dashboard</a></li>
                <li><a href="/users.html" class="nav-link text-dark" id="menu-users">Users</a></li>
                <li><a href="/selection.html" class="nav-link text-dark">Companies</a></li>
                <li><a href="/departments.html" class="nav-link text-dark" id="menu-departments">Departments</a></li>
                <li><a href="/processes.html" class="nav-link" id="menu-processes">Processes</a></li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container mt-4">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu" aria-controls="offcanvasMenu">
                Menu
            </button>
            <h1>Crear Registro</h1>
        </header>

        <div class="card mb-4">
            <div class="card-header">
                Proceso
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-8">
                        <h5 class="card-title" id="process-name">Cargando...</h5>
                    </div>
                    <div class="col-md-2 text-end">
                        <strong>Hora Inicio:</strong> <span id="process-start-time">--:--</span>
                    </div>
                    <div class="col-md-2 text-end">
                        <strong>Hora Fin:</strong> <span id="process-end-time">--:--</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-table">
            <!-- Header -->
            <div class="row form-table-header border-bottom mb-2">
                <div class="col">MODULO</div>
                <div class="col">SISTEMA ORIGEN</div>
                <div class="col">FECHA PROCESO</div>
                <div class="col">HORA PROCESO</div>
                <div class="col">MENSAJE_ERROR</div>
                <div class="col">ESTATUS</div>
                <div class="col"></div> <!-- Empty for button -->
            </div>

            <!-- Form Rows -->
            <div id="registration-form-rows">
                <!-- Rows will be generated by JS or hardcoded -->
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const companyId = urlParams.get('companyId');
            const processId = urlParams.get('processId');
            const menu = document.getElementById('offcanvasMenu');

            const updateMenuLinks = (id) => {
                menu.querySelector('#menu-dashboard').href = `/dashboard.html?companyId=${id}`;
                menu.querySelector('#menu-users').href = `/users.html?companyId=${id}`;
                menu.querySelector('#menu-departments').href = `/departments.html?companyId=${id}`;
                menu.querySelector('#menu-processes').href = `/processes.html?companyId=${id}`;
                menu.querySelector('#menu-processes').classList.add('active');
            };

            const generateFormRow = (modulo, sistema) => {
                return `
                <div class="row mb-2 align-items-center">
                    <div class="col"><input type="text" class="form-control form-control-sm" value="${modulo}" readonly></div>
                    <div class="col"><input type="text" class="form-control form-control-sm" value="${sistema}" readonly></div>
                    <div class="col"><input type="date" class="form-control form-control-sm"></div>
                    <div class="col"><input type="time" class="form-control form-control-sm"></div>
                    <div class="col"><input type="text" class="form-control form-control-sm"></div>
                    <div class="col">
                        <select class="form-select form-select-sm">
                            <option selected>-</option>
                            <option value="1">OK</option>
                            <option value="2">ERROR</option>
                        </select>
                    </div>
                    <div class="col"><button class="btn btn-sm btn-outline-secondary">...</button></div>
                </div>`;
            };

            const populateForm = () => {
                const formRowsContainer = document.getElementById('registration-form-rows');
                const structure = [
                    { modulo: 'DETALLE POLIZAS RECIBOS', sistema: 'SIVI' },
                    { modulo: 'DETALLE POLIZAS RECIBOS', sistema: 'SABE' },
                    { modulo: 'DETALLE POLIZAS RECIBOS', sistema: 'SOS' },
                    { modulo: 'DETALLE POLIZAS RECIBOS', sistema: 'ODS' },
                    { modulo: 'RECHAZOS', sistema: 'SOS' },
                    { modulo: 'RECHAZOS', sistema: 'SIVI' },
                    { modulo: 'RECHAZOS', sistema: 'SABE' },
                    { modulo: 'RECHAZOS', sistema: 'ODS' },
                    { modulo: 'DEUDOR POR PRIMA', sistema: 'SOS' },
                    { modulo: 'DEUDOR POR PRIMA', sistema: 'SIVI' },
                    { modulo: 'DEUDOR POR PRIMA', sistema: 'SABE' },
                    { modulo: 'DEUDOR POR PRIMA', sistema: 'ACSEL' },
                    { modulo: 'DEUDOR POR PRIMA', sistema: 'ODS' },
                ];

                let html = '';
                structure.forEach(item => {
                    html += generateFormRow(item.modulo, item.sistema);
                });
                formRowsContainer.innerHTML = html;
            };


            if (companyId && processId) {
                updateMenuLinks(companyId);

                fetch(`/api/processes?companyId=${companyId}`)
                    .then(response => response.json())
                    .then(processes => {
                        const process = processes.find(p => p.id === processId);
                        if (process) {
                            document.getElementById('process-name').textContent = process.name;
                            document.getElementById('process-start-time').textContent = process.startTime;
                            document.getElementById('process-end-time').textContent = process.endTime;
                        } else {
                            document.getElementById('process-name').textContent = 'Process not found';
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching process details:', error);
                        document.getElementById('process-name').textContent = 'Error loading process';
                    });

                populateForm();

            } else {
                document.getElementById('process-name').textContent = 'No process selected.';
                updateMenuLinks('');
            }
        });
    </script>
</body>
</html>
