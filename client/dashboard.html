<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Offcanvas Menu -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu" aria-labelledby="offcanvasMenuLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasMenuLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="#" class="nav-link active" aria-current="page">
                        Dashboard
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link text-dark">
                        Users
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link text-dark">
                        Companies
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link text-dark">
                        Departments
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link text-dark">
                        Processes
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container mt-4">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <!-- Button to toggle the offcanvas menu -->
            <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu" aria-controls="offcanvasMenu">
                Menu
            </button>
            <h1>Dashboard</h1>
        </header>

        <div class="p-5 mb-4 bg-light rounded-3">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold">Welcome, Captain!</h1>
                <p class="col-md-8 fs-4">This is your new dashboard. Use the menu to navigate through the different sections of the application.</p>
            </div>
        </div>

        <hr>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Companies</h2>
            <div>
                <button id="add-company-btn" class="btn btn-success">Add</button>
                <button id="edit-company-btn" class="btn btn-warning" disabled>Edit</button>
                <button id="delete-company-btn" class="btn btn-danger" disabled>Delete</button>
            </div>
        </div>
        <div id="company-list" class="row">
            <!-- Company cards will be inserted here by JavaScript -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const companyList = document.getElementById('company-list');
            const editBtn = document.getElementById('edit-company-btn');
            const deleteBtn = document.getElementById('delete-company-btn');

            fetch('/api/companies')
                .then(response => response.json())
                .then(companies => {
                    console.log('Companies loaded:', companies);
                    companyList.innerHTML = ''; // Clear existing content
                    companies.forEach(company => {
                        const companyCard = document.createElement('div');
                        companyCard.className = 'col-md-4 mb-4';
                        companyCard.innerHTML = `
                            <div class="card" style="cursor: pointer;" data-id="${company.id}">
                                <div class="card-body">
                                    <h5 class="card-title">${company.name}</h5>
                                </div>
                            </div>
                        `;
                        companyList.appendChild(companyCard);

                        // Add click listener for selection
                        companyCard.querySelector('.card').addEventListener('click', (event) => {
                            // Remove active state from all other cards
                            document.querySelectorAll('#company-list .card').forEach(card => {
                                card.classList.remove('border-primary');
                            });
                            // Add active state to the clicked card
                            event.currentTarget.classList.add('border-primary');
                            console.log('Selected company ID:', company.id);

                            // Enable Edit and Delete buttons
                            editBtn.disabled = false;
                            deleteBtn.disabled = false;
                        });
                    });
                })
                .catch(error => console.error('Error fetching companies:', error));
        });
    </script>
</body>
</html>
