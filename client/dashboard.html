<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .summary-card {
            border-left-width: 5px;
        }
        .border-ok { border-left-color: #198754; }
        .border-falla { border-left-color: #dc3545; }
        .border-error { border-left-color: #dc3545; }
        .border-ambar { border-left-color: #ffc107; }
        .border-sin-ejecucion { border-left-color: #6c757d; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu" aria-controls="offcanvasMenu">
                Menu
            </button>
            <a class="navbar-brand" href="#">
                <img src="logo.png" alt="Avatar Logo" style="width:40px;" class="rounded-pill">
            </a>
        </div>
    </nav>
    <!-- Offcanvas Menu -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu" aria-labelledby="offcanvasMenuLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasMenuLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="/dashboard.html" class="nav-link" id="menu-dashboard">Dashboard</a>
                </li>
                <li>
                    <a href="/users.html" class="nav-link text-dark" id="menu-users">Users</a>
                </li>
                <li>
                    <a href="/selection.html" class="nav-link text-dark">Companies</a>
                </li>
                <li>
                    <a href="/departments.html" class="nav-link text-dark" id="menu-departments">Departments</a>
                </li>
                <li>
                    <a href="/processes.html" class="nav-link text-dark" id="menu-processes">Processes</a>
                </li>
                <li>
                    <a href="/monitoring.html" class="nav-link text-dark" id="menu-monitoring">Monitoring</a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container mt-4">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1>Dashboard</h1>
            <div class="col-md-3">
                <input type="date" id="date-filter" class="form-control">
            </div>
        </header>

        <div id="loading-spinner" class="text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div id="summary-container" class="row g-4" style="display: none;">
            <!-- Summary cards will be injected here by JavaScript -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const summaryContainer = document.getElementById('summary-container');
            const loadingSpinner = document.getElementById('loading-spinner');
            const dateFilter = document.getElementById('date-filter');
            const menu = document.getElementById('offcanvasMenu');
            const urlParams = new URLSearchParams(window.location.search);
            const companyId = urlParams.get('companyId');

            // --- Menu Logic ---
            const updateMenuLinks = (id) => {
                if (!id) return;
                menu.querySelector('#menu-dashboard').href = `dashboard.html?companyId=${id}`;
                menu.querySelector('#menu-users').href = `users.html?companyId=${id}`;
                menu.querySelector('#menu-departments').href = `departments.html?companyId=${id}`;
                menu.querySelector('#menu-processes').href = `processes.html?companyId=${id}`;
                menu.querySelector('#menu-monitoring').href = `monitoring.html?companyId=${id}`;

                const currentPage = window.location.pathname;
                if (currentPage.includes('dashboard.html')) {
                    menu.querySelector('#menu-dashboard').classList.add('active');
                }
            };

            // --- Page Logic ---
            const renderSummary = (summary) => {
                summaryContainer.innerHTML = '';
                const statuses = ['ok', 'falla', 'error', 'ambar', 'sin ejecucion'];

                statuses.forEach(status => {
                    const data = summary[status] || { total: 0, Alta: 0, Media: 0, Baja: 0 };
                    const card = document.createElement('div');
                    card.className = 'col-lg-4 col-md-6 mb-4';
                    card.innerHTML = `
                        <div class="card summary-card border-${status.replace(/\s+/g, '-')} h-100">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title text-uppercase">${status}</h5>
                                <p class="card-text display-4 fw-bold">${data.total}</p>
                                <table class="table table-sm mt-auto">
                                    <tbody>
                                        <tr><td>Alta</td><td class="text-end">${data.Alta}</td></tr>
                                        <tr><td>Media</td><td class="text-end">${data.Media}</td></tr>
                                        <tr><td>Baja</td><td class="text-end">${data.Baja}</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                    summaryContainer.appendChild(card);
                });
            };

            const fetchSummary = (date) => {
                if (!companyId) return;

                loadingSpinner.style.display = 'block';
                summaryContainer.style.display = 'none';

                fetch(`/api/summary?companyId=${companyId}&date=${date}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(data => {
                        renderSummary(data.summary);
                    })
                    .catch(error => {
                        console.error('Error fetching summary:', error);
                        summaryContainer.innerHTML = '<div class="alert alert-danger">Could not load summary data.</div>';
                    })
                    .finally(() => {
                        loadingSpinner.style.display = 'none';
                        summaryContainer.style.display = 'flex';
                    });
            };

            // --- Initial Load ---
            const today = new Date().toISOString().slice(0, 10);
            dateFilter.value = today;
            updateMenuLinks(companyId);
            fetchSummary(today);

            dateFilter.addEventListener('change', (e) => {
                fetchSummary(e.target.value);
            });
        });
    </script>
</body>
</html>
