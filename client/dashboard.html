<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Offcanvas Menu -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu" aria-labelledby="offcanvasMenuLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasMenuLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="#" class="nav-link active" aria-current="page">
                        Dashboard
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link text-dark">
                        Users
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link text-dark">
                        Companies
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link text-dark">
                        Departments
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link text-dark">
                        Processes
                    </a>
                </li>
                <hr>
                <li>
                    <a href="#" class="nav-link text-dark" id="back-to-selection-btn">
                        Back to Selection
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container mt-4">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <!-- Button to toggle the offcanvas menu -->
            <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu" aria-controls="offcanvasMenu">
                Menu
            </button>
            <h1>Dashboard</h1>
        </header>

        <div class="p-5 mb-4 bg-light rounded-3">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold" id="company-name-display">Welcome!</h1>
                <p class="col-md-8 fs-4">This is your company dashboard. Use the menu to navigate through the different sections.</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const companyNameDisplay = document.getElementById('company-name-display');
            const urlParams = new URLSearchParams(window.location.search);
            const companyId = urlParams.get('companyId');

            if (companyId) {
                // Find the company name from the mock data
                fetch('/api/companies')
                    .then(response => response.json())
                    .then(companies => {
                        const company = companies.find(c => c.id === parseInt(companyId));
                        if (company) {
                            companyNameDisplay.textContent = `Welcome, ${company.name}!`;
                        } else {
                            companyNameDisplay.textContent = 'Company not found';
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching companies:', error);
                        companyNameDisplay.textContent = 'Welcome!';
                    });
            }

            const backToSelectionBtn = document.getElementById('back-to-selection-btn');
            backToSelectionBtn.addEventListener('click', (event) => {
                event.preventDefault();
                if (confirm('Are you sure you want to go back to the company selection?')) {
                    window.location.href = '/selection.html';
                }
            });
        });
    </script>
</body>
</html>
