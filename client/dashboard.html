<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .summary-card {
            border-left-width: 5px;
        }
        .border-ok { border-left-color: #198754; }
        .border-falla { border-left-color: #dc3545; }
        .border-error { border-left-color: #dc3545; }
        .border-ambar { border-left-color: #ffc107; }
        .border-sin-ejecucion { border-left-color: #6c757d; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu" aria-controls="offcanvasMenu">
                Menu
            </button>
            <a class="navbar-brand" href="#">
                <img src="logo.png" alt="Avatar Logo" style="width:40px;" class="rounded-pill">
            </a>
        </div>
    </nav>
    <!-- Offcanvas Menu -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu" aria-labelledby="offcanvasMenuLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasMenuLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="/dashboard.html" class="nav-link" id="menu-dashboard">Dashboard</a>
                </li>
                <li>
                    <a href="/users.html" class="nav-link text-dark" id="menu-users">Users</a>
                </li>
                <li>
                    <a href="/selection.html" class="nav-link text-dark">Companies</a>
                </li>
                <li>
                    <a href="/departments.html" class="nav-link text-dark" id="menu-departments">Departments</a>
                </li>
                <li>
                    <a href="/processes.html" class="nav-link text-dark" id="menu-processes">Processes</a>
                </li>
                <li>
                    <a href="/monitoring.html" class="nav-link text-dark" id="menu-monitoring">Monitoring</a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container mt-4">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1>Dashboard</h1>
            <div>
                <div class="btn-group" role="group" aria-label="View Toggles">
                    <input type="radio" class="btn-check" name="view-toggle" id="view-cards" autocomplete="off" checked>
                    <label class="btn btn-outline-primary" for="view-cards">Cards</label>

                    <input type="radio" class="btn-check" name="view-toggle" id="view-gauges" autocomplete="off">
                    <label class="btn btn-outline-primary" for="view-gauges">Gauges</label>

                    <input type="radio" class="btn-check" name="view-toggle" id="view-donuts" autocomplete="off">
                    <label class="btn btn-outline-primary" for="view-donuts">Donuts</label>
                </div>
                <div class="form-check form-switch d-inline-block ms-3">
                    <input class="form-check-input" type="checkbox" id="pin-view-toggle">
                    <label class="form-check-label" for="pin-view-toggle">Pin View</label>
                </div>
            </div>
            <div class="col-md-3">
                <input type="date" id="date-filter" class="form-control">
            </div>
        </header>

        <div id="loading-spinner" class="text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div id="summary-container" class="row g-4" style="display: none;">
            <!-- Summary cards will be injected here by JavaScript -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const summaryContainer = document.getElementById('summary-container');
            const loadingSpinner = document.getElementById('loading-spinner');
            const dateFilter = document.getElementById('date-filter');
            const menu = document.getElementById('offcanvasMenu');
            const urlParams = new URLSearchParams(window.location.search);
            const companyId = urlParams.get('companyId');
            let currentView = 'cards';
            let currentSummaryData = {};
            const viewToggles = document.querySelectorAll('input[name="view-toggle"]');
            const pinViewToggle = document.getElementById('pin-view-toggle');

            // --- Menu Logic ---
            const updateMenuLinks = (id) => {
                if (!id) return;
                menu.querySelector('#menu-dashboard').href = `dashboard.html?companyId=${id}`;
                menu.querySelector('#menu-users').href = `users.html?companyId=${id}`;
                menu.querySelector('#menu-departments').href = `departments.html?companyId=${id}`;
                menu.querySelector('#menu-processes').href = `processes.html?companyId=${id}`;
                menu.querySelector('#menu-monitoring').href = `monitoring.html?companyId=${id}`;

                const currentPage = window.location.pathname;
                if (currentPage.includes('dashboard.html')) {
                    menu.querySelector('#menu-dashboard').classList.add('active');
                }
            };

            // --- Render Logic ---
            const render = () => {
                summaryContainer.innerHTML = '';
                const statuses = ['ok', 'falla', 'error', 'ambar', 'sin ejecucion'];

                statuses.forEach(status => {
                    const data = currentSummaryData[status] || { total: 0, Alta: 0, Media: 0, Baja: 0 };
                    const container = document.createElement('div');
                    container.className = 'col-lg-4 col-md-6 mb-4';

                    if (currentView === 'cards') {
                        container.innerHTML = `
                            <div class="card summary-card border-${status.replace(/\s+/g, '-')} h-100">
                                <div class="card-body text-center">
                                    <h5 class="card-title text-uppercase">${status}</h5>
                                    <p class="card-text display-4 fw-bold">${data.total}</p>
                                </div>
                                <div class="card-footer">
                                    <table class="table table-sm mb-0">
                                        <tbody>
                                            <tr><td>Alta</td><td class="text-end">${data.Alta}</td></tr>
                                            <tr><td>Media</td><td class="text-end">${data.Media}</td></tr>
                                            <tr><td>Baja</td><td class="text-end">${data.Baja}</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>`;
                    } else {
                        container.innerHTML = `<canvas id="chart-${status}"></canvas>`;
                    }
                    summaryContainer.appendChild(container);

                    if (currentView !== 'cards') {
                        const ctx = document.getElementById(`chart-${status}`).getContext('2d');
                        const chartData = {
                            labels: ['Alta', 'Media', 'Baja'],
                            datasets: [{
                                data: [data.Alta, data.Media, data.Baja],
                                backgroundColor: ['#dc3545', '#ffc107', '#198754']
                            }]
                        };
                        const options = {
                            responsive: true,
                            plugins: {
                                legend: { position: 'top' },
                                title: { display: true, text: `${status.toUpperCase()} (${data.total})` }
                            },
                            circumference: currentView === 'gauges' ? 180 : 360,
                            rotation: currentView === 'gauges' ? -90 : 0
                        };

                        new Chart(ctx, {
                            type: 'doughnut',
                            data: chartData,
                            options: options
                        });
                    }
                });
            };

            const fetchSummary = (date) => {
                if (!companyId) return;

                loadingSpinner.style.display = 'block';
                summaryContainer.style.display = 'none';

                fetch(`/api/summary?companyId=${companyId}&date=${date}`)
                    .then(response => response.json())
                    .then(data => {
                        currentSummaryData = data.summary;
                        render();
                    })
                    .catch(error => {
                        console.error('Error fetching summary:', error);
                        summaryContainer.innerHTML = '<div class="alert alert-danger">Could not load summary data.</div>';
                    })
                    .finally(() => {
                        loadingSpinner.style.display = 'none';
                        summaryContainer.style.display = 'flex';
                    });
            };

            // --- Event Listeners ---
            viewToggles.forEach(toggle => {
                toggle.addEventListener('change', (e) => {
                    currentView = e.target.id.split('-')[1];
                    render();
                    if (pinViewToggle.checked) {
                        localStorage.setItem('dashboardView', currentView);
                    }
                });
            });

            pinViewToggle.addEventListener('change', () => {
                if (pinViewToggle.checked) {
                    localStorage.setItem('dashboardView', currentView);
                } else {
                    localStorage.removeItem('dashboardView');
                }
            });

            dateFilter.addEventListener('change', (e) => {
                fetchSummary(e.target.value);
            });

            // --- Initial Load ---
            const savedView = localStorage.getItem('dashboardView');
            if (savedView) {
                currentView = savedView;
                document.getElementById(`view-${savedView}`).checked = true;
                pinViewToggle.checked = true;
            }

            const today = new Date().toISOString().slice(0, 10);
            dateFilter.value = today;
            updateMenuLinks(companyId);
            fetchSummary(today);
        });
    </script>
</body>
</html>
