<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .summary-card { border-left-width: 5px; }
        .border-ok { border-left-color: #198754; }
        .border-falla { border-left-color: #dc3545; }
        .border-error { border-left-color: #dc3545; }
        .border-ambar { border-left-color: #ffc107; }
        .border-sin-ejecucion { border-left-color: #6c757d; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu">Menu</button>
            <a class="navbar-brand ms-3" href="#">
                <img src="logo.png" alt="Avatar Logo" style="width:40px;" class="rounded-pill">
            </a>
            <div class="ms-auto">
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </nav>
    <!-- Offcanvas Menu -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item"><a href="#" class="nav-link" id="menu-dashboard">Dashboard</a></li>
                <li><a href="#" class="nav-link text-dark" id="menu-users">Users</a></li>
                <li><a href="/selection.html" class="nav-link text-dark">Companies</a></li>
                <li><a href="#" class="nav-link text-dark" id="menu-departments">Departments</a></li>
                <li><a href="#" class="nav-link text-dark" id="menu-processes">Processes</a></li>
                <li><a href="#" class="nav-link text-dark" id="menu-monitoring">Monitoring</a></li>
                <li><a href="#" class="nav-link text-dark" id="menu-escalation">Escalation</a></li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container mt-4">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1 id="dashboard-title">Dashboard</h1>
            <input type="date" id="date-filter" class="form-control" style="width: auto;">
        </header>

        <!-- Tab Navigation -->
        <ul class="nav nav-tabs" id="dashboardTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="criticality-tab" data-bs-toggle="tab" data-bs-target="#criticality-content" type="button">Criticidad</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="affected-tab" data-bs-toggle="tab" data-bs-target="#affected-content" type="button">Procesos Afectados</button>
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content" id="dashboardTabContent">
            <div class="tab-pane fade show active" id="criticality-content" role="tabpanel">
                <div id="loading-spinner" class="text-center mt-4">
                    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
                </div>
                <div id="summary-container" class="row g-4 mt-1" style="display: none;"></div>
            </div>
            <div class="tab-pane fade" id="affected-content" role="tabpanel">
                <div id="affected-processes-container" class="mt-4"><p>Cargando procesos afectados...</p></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            protectPage();
            const user = getLoggedInUser();
            const companyId = sessionStorage.getItem('selectedCompanyId');
            const companyName = sessionStorage.getItem('selectedCompanyName');

            if (!companyId) {
                alert('No company selected. Redirecting to company selection.');
                window.location.href = '/selection.html';
                return;
            }

            // --- Elements ---
            const summaryContainer = document.getElementById('summary-container');
            const loadingSpinner = document.getElementById('loading-spinner');
            const dateFilter = document.getElementById('date-filter');
            const logoutBtn = document.getElementById('logout-btn');
            const affectedTab = document.getElementById('affected-tab');
            const affectedContainer = document.getElementById('affected-processes-container');

            let currentSummaryData = {};
            let affectedDataLoaded = false;
            let charts = {};

            // --- UI Setup ---
            document.getElementById('dashboard-title').textContent = `Dashboard - ${companyName}`;
            logoutBtn.addEventListener('click', logout);

            const updateMenuLinks = () => {
                const menu = document.getElementById('offcanvasMenu');
                menu.querySelector('#menu-dashboard').href = `dashboard.html`;
                menu.querySelector('#menu-users').href = `users.html`;
                menu.querySelector('#menu-departments').href = `departments.html`;
                menu.querySelector('#menu-processes').href = `processes.html`;
                menu.querySelector('#menu-monitoring').href = `monitoring.html`;
                menu.querySelector('#menu-escalation').href = `escalation.html`;
                menu.querySelector('#menu-dashboard').classList.add('active');
            };

            // --- Render Logic ---
            const renderSummary = () => {
                summaryContainer.innerHTML = '';
                Object.values(charts).forEach(chart => chart.destroy());
                charts = {};

                const statuses = ['ok', 'falla', 'error', 'ambar', 'sin ejecucion'];
                statuses.forEach(status => {
                    const data = currentSummaryData[status] || { total: 0, Alta: 0, Media: 0, Baja: 0 };
                    const cardHtml = `
                        <div class="col-lg-4 col-md-6 mb-4">
                            <div class="card summary-card border-${status.replace(/\s+/g, '-')} h-100">
                                <div class="card-body text-center">
                                    <h5 class="card-title text-uppercase">${status}</h5>
                                    <p class="card-text display-4 fw-bold">${data.total}</p>
                                    <table class="table table-sm mt-3">
                                        <tbody>
                                            <tr><td>Alta</td><td class="text-end">${data.Alta}</td></tr>
                                            <tr><td>Media</td><td class="text-end">${data.Media}</td></tr>
                                            <tr><td>Baja</td><td class="text-end">${data.Baja}</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>`;
                    summaryContainer.insertAdjacentHTML('beforeend', cardHtml);
                });
            };

            const fetchSummary = async (date) => {
                loadingSpinner.style.display = 'block';
                summaryContainer.style.display = 'none';

                let url = `/api/summary?date=${date}`;
                // Superadmin needs to specify the company, for others it's inferred by the backend.
                if (user.role === 'superadmin') {
                    url += `&companyId=${companyId}`;
                }

                try {
                    const response = await fetchWithAuth(url);
                    const data = await response.json();
                    currentSummaryData = data.summary;
                    renderSummary();
                } catch (error) {
                    console.error('Error fetching summary:', error);
                    summaryContainer.innerHTML = '<div class="alert alert-danger">Could not load summary data.</div>';
                } finally {
                    loadingSpinner.style.display = 'none';
                    summaryContainer.style.display = 'flex';
                }
            };

            // --- Affected Processes Logic ---
            const renderAffectedProcesses = (data) => {
                affectedContainer.innerHTML = '';
                if (data.length === 0) {
                    affectedContainer.innerHTML = '<div class="alert alert-info">No processes are affected by dependency failures.</div>';
                    return;
                }
                const list = data.map(item => `
                    <div class="list-group-item">
                        <div class="d-flex w-100 justify-content-between">
                            <h5 class="mb-1">${item.parentProcessName}</h5>
                            <small>ID: ${item.parentProcessId}</small>
                        </div>
                        <p class="mb-1">Affected by child: <strong>${item.failingChildName}</strong> (ID: ${item.failingChildId})</p>
                        <small>Child Status: <span class="badge bg-${item.childStatus === 'falla' ? 'danger' : 'warning'}">${item.childStatus.toUpperCase()}</span></small>
                    </div>`).join('');
                affectedContainer.innerHTML = `<div class="list-group">${list}</div>`;
            };

            const fetchAffectedProcesses = async () => {
                let url = '/api/affected-processes';
                 if (user.role === 'superadmin') {
                    url += `?companyId=${companyId}`;
                }

                try {
                    const response = await fetchWithAuth(url);
                    const data = await response.json();
                    renderAffectedProcesses(data);
                    affectedDataLoaded = true;
                } catch (error) {
                    console.error('Error fetching affected processes:', error);
                    affectedContainer.innerHTML = '<div class="alert alert-danger">Could not load data.</div>';
                }
            };

            // --- Event Listeners ---
            dateFilter.addEventListener('change', (e) => fetchSummary(e.target.value));
            affectedTab.addEventListener('shown.bs.tab', () => {
                if (!affectedDataLoaded) fetchAffectedProcesses();
            });

            // --- Initial Load ---
            const today = new Date().toISOString().slice(0, 10);
            dateFilter.value = today;
            updateMenuLinks();
            fetchSummary(today);
        });
    </script>
</body>
</html>
