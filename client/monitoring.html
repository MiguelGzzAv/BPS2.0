<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Monitoring</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-ok { color: #198754; font-weight: bold; }
        .status-falla, .status-error { color: #dc3545; font-weight: bold; }
        .status-ambar { color: #ffc107; font-weight: bold; }
        .status-sin-ejecucion { color: #6c757d; font-weight: bold; }
        .badge-ok { background-color: #198754; }
        .badge-falla, .badge-error { background-color: #dc3545; }
        .badge-ambar { background-color: #ffc107; color: #000; }
        .badge-sin-ejecucion { background-color: #6c757d; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu">Menu</button>
            <a class="navbar-brand ms-3" href="#"><img src="logo.png" alt="Avatar Logo" style="width:40px;" class="rounded-pill"></a>
            <div class="ms-auto"><button id="logout-btn" class="btn btn-secondary">Logout</button></div>
        </div>
    </nav>
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu">
        <div class="offcanvas-header"><h5 class="offcanvas-title">Menu</h5><button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button></div>
        <div class="offcanvas-body">
            <ul class="nav nav-pills flex-column mb-auto">
                <li><a href="dashboard.html" class="nav-link text-dark" id="menu-dashboard">Dashboard</a></li>
                <li><a href="users.html" class="nav-link text-dark" id="menu-users">Users</a></li>
                <li><a href="selection.html" class="nav-link text-dark">Companies</a></li>
                <li><a href="departments.html" class="nav-link text-dark" id="menu-departments">Departments</a></li>
                <li><a href="processes.html" class="nav-link text-dark" id="menu-processes">Processes</a></li>
                <li><a href="monitoring.html" class="nav-link" id="menu-monitoring">Monitoring</a></li>
                <li><a href="escalation.html" class="nav-link text-dark" id="menu-escalation">Escalation</a></li>
            </ul>
        </div>
    </div>

    <main class="container mt-4">
        <h1 class="mb-4" id="header-title">Process Monitoring</h1>
        <div class="row mb-3 gx-2">
            <div class="col-md-5"><input type="text" id="filter-name" class="form-control" placeholder="Filter by process name..."></div>
            <div class="col-md-4">
                <select id="filter-status" class="form-select">
                    <option value="">All Statuses</option>
                    <option value="ok">OK</option><option value="falla">Falla</option><option value="error">Error</option>
                    <option value="ambar">Ambar</option><option value="sin ejecucion">Sin Ejecucion</option>
                </select>
            </div>
            <div class="col-md-3"><button id="sort-time" class="btn btn-outline-secondary w-100">Sort by Time</button></div>
        </div>
        <table class="table table-hover">
            <thead class="table-light"><tr><th>PROCESO</th><th>INICIO</th><th>FIN</th><th>ESTATUS</th><th>URGENCIA</th><th>ACCIONES</th></tr></thead>
            <tbody id="monitoring-list"></tbody>
        </table>
    </main>

    <div class="modal fade" id="registrationModal" tabindex="-1"><div class="modal-dialog modal-xl"><div class="modal-content"><div class="modal-header bg-dark text-white"><h5 class="modal-title" id="registrationModalLabel">Crear Registro</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="process-info-bar mb-3 p-2 rounded bg-light"><div class="d-flex justify-content-between"><div><strong>Proceso:</strong> <span id="modal-process-name"></span></div><div><strong>Hora Inicio:</strong> <span id="modal-start-time"></span><strong class="ms-4">Hora Fin:</strong> <span id="modal-end-time"></span></div></div></div><form id="modal-registration-form"></form></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button><button type="button" class="btn btn-primary" id="save-single-registration-btn">Guardar Registro</button></div></div></div></div>
    <div class="modal fade" id="multiPhaseRegistrationModal" tabindex="-1"><div class="modal-dialog modal-fullscreen"><div class="modal-content"><div class="modal-header bg-primary text-white"><h5 class="modal-title" id="multiPhaseRegistrationModalLabel">Registrar Fases</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="table-responsive"><table class="table table-bordered"><thead class="table-light"><tr><th>Fase</th><th>Estatus Actual</th><th>Campos de Registro</th><th>Acciones</th></tr></thead><tbody id="multi-phase-table-body"></tbody></table></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button></div></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            protectPage();
            const user = getLoggedInUser();
            const companyId = sessionStorage.getItem('selectedCompanyId');
            const companyName = sessionStorage.getItem('selectedCompanyName');

            if (!companyId) {
                alert('No company selected. Redirecting...');
                window.location.href = '/selection.html';
                return;
            }

            const canRegister = user.role === 'admin' || user.role === 'superadmin' || user.role === 'operator';

            const monitoringList = document.getElementById('monitoring-list');
            const registrationModal = new bootstrap.Modal(document.getElementById('registrationModal'));
            const multiPhaseRegistrationModal = new bootstrap.Modal(document.getElementById('multiPhaseRegistrationModal'));
            const modalProcessName = document.getElementById('modal-process-name');
            const modalStartTime = document.getElementById('modal-start-time');
            const modalEndTime = document.getElementById('modal-end-time');
            const modalRegistrationForm = document.getElementById('modal-registration-form');
            const saveSingleRegistrationBtn = document.getElementById('save-single-registration-btn');
            const multiPhaseModalLabel = document.getElementById('multiPhaseRegistrationModalLabel');
            const multiPhaseTableBody = document.getElementById('multi-phase-table-body');
            const logoutBtn = document.getElementById('logout-btn');

            let userList = [];
            let currentProcessId = null;
            let currentPhaseName = null;
            let masterProcessList = [];
            let allRegistrations = [];

            document.getElementById('header-title').textContent = `Monitoring - ${companyName}`;
            logoutBtn.addEventListener('click', logout);

            const updateMenuLinks = () => {
                const menu = document.getElementById('offcanvasMenu');
                menu.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
                menu.querySelector('#menu-monitoring').classList.add('active');
            };

            const fetchAndRenderAll = async () => {
                const companyQueryParam = user.role === 'superadmin' ? `?companyId=${companyId}` : '';
                try {
                    const [processesRes, registrationsRes, usersRes] = await Promise.all([
                        fetchWithAuth(`/api/processes${companyQueryParam}`),
                        fetchWithAuth(`/api/registrations${companyQueryParam}`),
                        fetchWithAuth(`/api/users${companyQueryParam}`)
                    ]);
                    if (!processesRes.ok || !registrationsRes.ok || !usersRes.ok) throw new Error('Failed to fetch initial data');
                    masterProcessList = await processesRes.json();
                    allRegistrations = await registrationsRes.json();
                    userList = await usersRes.json();
                    displayProcesses();
                } catch (error) {
                    console.error('Error fetching data:', error);
                    monitoringList.innerHTML = '<tr><td colspan="6" class="text-danger">Error loading data. Please try again.</td></tr>';
                }
            };

            const displayProcesses = () => {
                const nameFilter = document.getElementById('filter-name').value.toLowerCase();
                const statusFilter = document.getElementById('filter-status').value;
                let processesToDisplay = [...masterProcessList];
                if (nameFilter) processesToDisplay = processesToDisplay.filter(p => p.name.toLowerCase().includes(nameFilter));
                if (statusFilter) processesToDisplay = processesToDisplay.filter(p => p.status === statusFilter);

                const sortButton = document.getElementById('sort-time');
                if (sortButton.dataset.sortOrder) {
                    processesToDisplay.sort((a, b) => {
                        const timeA = parseInt((a.startTime || '0').replace(':', ''), 10);
                        const timeB = parseInt((b.startTime || '0').replace(':', ''), 10);
                        return sortButton.dataset.sortOrder === 'asc' ? timeA - timeB : timeB - timeA;
                    });
                }

                monitoringList.innerHTML = '';
                if (processesToDisplay.length === 0) {
                    monitoringList.innerHTML = '<tr><td colspan="6" class="text-center">No matching processes found.</td></tr>';
                    return;
                }
                const processMap = new Map(masterProcessList.map(p => [p.id, p]));
                const childProcessIds = new Set(masterProcessList.flatMap(p => (p.childProcesses || []).map(child => child.id)));
                processesToDisplay.forEach(proc => {
                    if (!childProcessIds.has(proc.id)) renderProcessRow(proc, 0, processMap);
                });
            };

            const renderProcessRow = (proc, level, processMap) => {
                const status = proc.status || 'sin ejecucion';
                const hasChildren = proc.childProcesses && proc.childProcesses.length > 0;
                const row = document.createElement('tr');
                row.className = `child-of-${proc.parentId || 'root'}`.trim() + (level > 0 ? ' collapse' : '');
                row.dataset.processId = proc.id;

                const hasActiveDependency = hasChildren && proc.childProcesses.some(c => c.dependency);
                const hasOwnFieldsToRegister = proc.internalPhases && proc.internalPhases.some(phase => phase.fields && phase.fields.length > 0);
                const showRegisterButton = !(hasActiveDependency && !hasOwnFieldsToRegister);
                const badgeClass = `badge-${status.toLowerCase().replace(/\s+/g, '-')}`;

                row.innerHTML = `
                    <td style="padding-left: ${level * 25}px;">
                        ${hasChildren ? `<button class="btn btn-sm btn-light me-2 expand-btn" data-bs-toggle="collapse" data-bs-target=".child-of-${proc.id}">▶</button>` : `<span style="display: inline-block; width: 38px;"></span>`}
                        ${proc.name}
                    </td>
                    <td>${proc.startTime || ''}</td><td>${proc.endTime || ''}</td>
                    <td><span class="badge ${badgeClass}">${status.toUpperCase()}</span></td>
                    <td><span class="badge bg-secondary">${proc.criticidad || 'Baja'}</span></td>
                    <td>${canRegister && showRegisterButton ? `<button class="btn btn-primary btn-sm register-btn">Registrar</button>` : 'No actions'}</td>`;
                monitoringList.appendChild(row);

                if (hasChildren) {
                    proc.childProcesses.forEach(childLink => {
                        const childProc = processMap.get(childLink.id);
                        if (childProc) {
                            childProc.parentId = proc.id;
                            renderProcessRow(childProc, level + 1, processMap);
                        }
                    });
                }
            };

            const getFormFieldHtml = (field, isInline = false) => {
                const fieldId = `field-${field.name.replace(/\s+/g, '-')}-${Date.now()}`;
                let inputHtml = '';
                switch (field.type) {
                    case 'status':
                        inputHtml = `<select id="${fieldId}" class="form-select form-select-sm" data-field-name="${field.name}">${['ok', 'falla', 'ambar', 'error', 'sin ejecucion'].map(opt => `<option value="${opt}">${opt.charAt(0).toUpperCase() + opt.slice(1)}</option>`).join('')}</select>`;
                        break;
                    case 'responsable':
                        inputHtml = `<select id="${fieldId}" class="form-select form-select-sm" data-field-name="${field.name}"><option selected>Choose...</option>${userList.map(user => `<option value="${user.name}">${user.name}</option>`).join('')}</select>`;
                        break;
                    default:
                        inputHtml = `<input type="text" id="${fieldId}" class="form-control form-control-sm" data-field-name="${field.name}" placeholder="${field.name}">`;
                }
                return isInline ? inputHtml : `<div class="row mb-3"><label for="${fieldId}" class="col-sm-4 col-form-label">${field.name}</label><div class="col-sm-8">${inputHtml}</div></div>`;
            };

            const openRegistrationModal = (proc, phaseName = null) => {
                currentProcessId = proc.id;
                currentPhaseName = phaseName || (proc.internalPhases && proc.internalPhases.length > 0 ? proc.internalPhases[0].name : 'default');
                modalProcessName.textContent = phaseName ? `${proc.name} - ${phaseName}` : proc.name;
                modalStartTime.textContent = proc.startTime;
                modalEndTime.textContent = proc.endTime;
                modalRegistrationForm.innerHTML = '';
                const phase = proc.internalPhases.find(p => p.name === currentPhaseName) || { fields: [] };
                if (phase.fields && phase.fields.length > 0) {
                    phase.fields.forEach(field => modalRegistrationForm.insertAdjacentHTML('beforeend', getFormFieldHtml(field)));
                } else {
                    modalRegistrationForm.innerHTML = '<p>No fields defined for this registration.</p>';
                }
                registrationModal.show();
            };

            const openMultiPhaseModal = (proc) => {
                multiPhaseModalLabel.textContent = `Registrar Fases: ${proc.name}`;
                multiPhaseTableBody.innerHTML = '';
                proc.internalPhases.forEach(phase => {
                    const latestPhaseReg = allRegistrations.filter(r => r.processId === proc.id && r.phase === phase.name).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp))[0];
                    const currentStatus = latestPhaseReg?.values.find(v => v.name === 'Status')?.value || 'N/A';
                    const badgeClass = `badge-${currentStatus.toLowerCase().replace(/\s+/g, '-')}`;
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${phase.name}</td>
                        <td><span class="badge ${badgeClass}">${currentStatus.toUpperCase()}</span></td>
                        <td class="phase-form-fields">${(phase.fields || []).map(field => `<div class="mb-2">${getFormFieldHtml(field, true)}</div>`).join('')}</td>
                        <td>${canRegister ? `<button class="btn btn-success btn-sm save-phase-btn" data-process-id="${proc.id}" data-phase-name="${phase.name}">Guardar</button>`: 'No actions'}</td>
                    `;
                    multiPhaseTableBody.appendChild(row);
                });
                multiPhaseRegistrationModal.show();
            };

            const saveRegistration = async (processId, phase, values) => {
                const registrationData = { processId, phase, values, timestamp: new Date().toISOString() };
                if (user.role === 'superadmin') registrationData.companyId = companyId;
                try {
                    await fetchWithAuth('/api/registrations', { method: 'POST', body: JSON.stringify(registrationData) });
                    registrationModal.hide();
                    multiPhaseRegistrationModal.hide();
                    fetchAndRenderAll();
                } catch (err) { console.error(err); alert('Error saving.'); }
            };

            monitoringList.addEventListener('click', (e) => {
                if (e.target.closest('.register-btn')) {
                    const procId = e.target.closest('tr').dataset.processId;
                    const proc = masterProcessList.find(p => p.id === procId);
                    if (proc) {
                        if (proc.mode === 'Multiple') openMultiPhaseModal(proc);
                        else openRegistrationModal(proc);
                    }
                }
            });
            saveSingleRegistrationBtn.addEventListener('click', () => {
                const values = Array.from(modalRegistrationForm.querySelectorAll('[data-field-name]')).map(input => ({ name: input.dataset.fieldName, value: input.value }));
                saveRegistration(currentProcessId, currentPhaseName, values);
            });
            multiPhaseTableBody.addEventListener('click', (e) => {
                if (e.target.classList.contains('save-phase-btn')) {
                    const button = e.target;
                    const values = Array.from(button.closest('tr').querySelectorAll('[data-field-name]')).map(input => ({ name: input.dataset.fieldName, value: input.value }));
                    saveRegistration(button.dataset.processId, button.dataset.phaseName, values);
                }
            });

            updateMenuLinks();
            fetchAndRenderAll();
            setInterval(fetchAndRenderAll, 60000);

            document.getElementById('filter-name').addEventListener('input', displayProcesses);
            document.getElementById('filter-status').addEventListener('change', displayProcesses);
            document.getElementById('sort-time').addEventListener('click', function() {
                this.dataset.sortOrder = this.dataset.sortOrder === 'asc' ? 'desc' : 'asc';
                displayProcesses();
            });
        });
    </script>
</body>
</html>
