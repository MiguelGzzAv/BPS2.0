<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Monitoring</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-ok { color: #198754; font-weight: bold; }
        .status-falla, .status-error { color: #dc3545; font-weight: bold; }
        .status-ambar { color: #ffc107; font-weight: bold; }
        .status-sin-ejecucion { color: #6c757d; font-weight: bold; }
        .status-por-iniciar { color: #adb5bd; }

        .badge-ok { background-color: #198754; }
        .badge-falla, .badge-error { background-color: #dc3545; }
        .badge-ambar { background-color: #ffc107; color: #000; }
        .badge-sin-ejecucion { background-color: #6c757d; }
        .badge-por-iniciar { background-color: #adb5bd; }

        .badge { font-size: 0.9em; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu" aria-controls="offcanvasMenu">
                Menu
            </button>
            <a class="navbar-brand" href="#">
                <img src="logo.png" alt="Avatar Logo" style="width:40px;" class="rounded-pill">
            </a>
        </div>
    </nav>
    <!-- Offcanvas Menu -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu" aria-labelledby="offcanvasMenuLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasMenuLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="/dashboard.html" class="nav-link" id="menu-dashboard">Dashboard</a>
                </li>
                <li>
                    <a href="/users.html" class="nav-link text-dark" id="menu-users">Users</a>
                </li>
                <li>
                    <a href="/selection.html" class="nav-link text-dark">Companies</a>
                </li>
                <li>
                    <a href="/processes.html" class="nav-link text-dark" id="menu-processes">Processes</a>
                </li>
                <li>
                    <a href="/monitoring.html" class="nav-link text-dark" id="menu-monitoring">Monitoring</a>
                </li>
                <li>
                    <a href="/escalation.html" class="nav-link text-dark" id="menu-escalation">Escalation</a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container mt-4">
        <h1 class="mb-4">Process Monitoring</h1>

        <div class="row mb-3 gx-2">
            <div class="col-md-5">
                <input type="text" id="filter-name" class="form-control" placeholder="Filter by process name...">
            </div>
            <div class="col-md-4">
                <select id="filter-status" class="form-select">
                    <option value="">All Statuses</option>
                    <option value="ok">OK</option>
                    <option value="falla">Falla</option>
                    <option value="error">Error</option>
                    <option value="ambar">Ambar</option>
                    <option value="sin ejecucion">Sin Ejecucion</option>
                    <option value="POR INICIAR">Por Iniciar</option>
                </select>
            </div>
            <div class="col-md-3">
                <button id="sort-time" class="btn btn-outline-secondary w-100">Sort by Time</button>
            </div>
        </div>

        <table class="table table-hover">
            <thead class="table-light">
                <tr>
                    <th>PROCESO</th>
                    <th>INICIO</th>
                    <th>FIN</th>
                    <th>ESTATUS</th>
                    <th>URGENCIA</th>
                    <th>ACCIONES</th>
                </tr>
            </thead>
            <tbody id="monitoring-list">
                <!-- Process rows will be inserted here by JavaScript -->
            </tbody>
        </table>
    </main>

    <!-- Registration Modal -->
    <div class="modal fade" id="registrationModal" tabindex="-1" aria-labelledby="registrationModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header" style="background-color: #343a40; color: white;">
                    <h5 class="modal-title" id="registrationModalLabel">Crear Registro</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="process-info-bar mb-3 p-2 rounded" style="background-color: #e9ecef;">
                        <div class="d-flex justify-content-between">
                            <div><strong>Proceso:</strong> <span id="modal-process-name"></span></div>
                            <div>
                                <strong>Hora Inicio:</strong> <span id="modal-start-time"></span>
                                <strong class="ms-4">Hora Fin:</strong> <span id="modal-end-time"></span>
                            </div>
                        </div>
                    </div>
                    <form id="modal-registration-form">
                        <!-- Dynamic form fields will be injected here by JS -->
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary">Guardar Registro</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const monitoringList = document.getElementById('monitoring-list');
            const menu = document.getElementById('offcanvasMenu');
            const urlParams = new URLSearchParams(window.location.search);
            const companyId = urlParams.get('companyId') || 'default';
            const registrationModal = new bootstrap.Modal(document.getElementById('registrationModal'));
            const modalProcessName = document.getElementById('modal-process-name');
            const modalStartTime = document.getElementById('modal-start-time');
            const modalEndTime = document.getElementById('modal-end-time');
            const modalRegistrationForm = document.getElementById('modal-registration-form');
            const saveRegistrationBtn = document.querySelector('#registrationModal .btn-primary');
            const sortTimeButton = document.getElementById('sort-time');
            let userList = [];
            let currentProcessId = null;
            let currentPhaseName = null;
            let masterProcessList = [];
            let allRegistrations = [];
            let calculatedProcessStates = new Map();

            const updateMenuLinks = (id) => {
                if (!id) return;
                menu.querySelector('#menu-dashboard').href = `dashboard.html?companyId=${id}`;
                menu.querySelector('#menu-users').href = `users.html?companyId=${id}`;
                menu.querySelector('#menu-processes').href = `processes.html?companyId=${id}`;
                menu.querySelector('#menu-monitoring').href = `monitoring.html?companyId=${id}`;
                menu.querySelector('#menu-escalation').href = `/escalation.html?companyId=${id}`;
                if (window.location.pathname.includes('monitoring.html')) {
                    menu.querySelector('#menu-monitoring').classList.add('active');
                }
            };

            const calculateProcessStates = (processes, registrations) => {
                const processMap = new Map(processes.map(p => [p.id, p]));
                calculatedProcessStates.clear();
                const getStatus = (procId) => {
                    if (calculatedProcessStates.has(procId)) return calculatedProcessStates.get(procId);
                    const proc = processMap.get(procId);
                    if (!proc) return 'POR INICIAR';

                    if (proc.exclusiveDependency && proc.childProcesses && proc.childProcesses.length > 0) {
                        const childStatus = getStatus(proc.childProcesses[0]);
                        calculatedProcessStates.set(procId, childStatus);
                        return childStatus;
                    }

                    const relevantRegistrations = registrations.filter(r => r.processId === proc.id).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                    if (relevantRegistrations.length === 0) {
                        calculatedProcessStates.set(procId, 'POR INICIAR');
                        return 'POR INICIAR';
                    }

                    const latestRegistration = relevantRegistrations[0];
                    const statusField = latestRegistration.values.find(v => v.name === 'Status');
                    const status = statusField ? statusField.value.toLowerCase() : 'por iniciar';
                    calculatedProcessStates.set(procId, status);
                    return status;
                };
                processes.forEach(p => getStatus(p.id));
            };

            const displayProcesses = () => {
                const nameFilter = document.getElementById('filter-name').value.toLowerCase();
                const statusFilter = document.getElementById('filter-status').value;
                let processesToDisplay = [...masterProcessList];
                const childProcessIds = new Set(processesToDisplay.flatMap(p => p.childProcesses || []));

                if (nameFilter) processesToDisplay = processesToDisplay.filter(p => p.name.toLowerCase().includes(nameFilter));
                if (statusFilter) processesToDisplay = processesToDisplay.filter(p => (calculatedProcessStates.get(p.id) || 'POR INICIAR') === statusFilter);
                if (sortTimeButton.dataset.sortOrder) {
                    processesToDisplay.sort((a, b) => {
                        const timeA = parseInt(a.startTime.replace(':', ''), 10);
                        const timeB = parseInt(b.startTime.replace(':', ''), 10);
                        return sortTimeButton.dataset.sortOrder === 'asc' ? timeA - timeB : timeB - timeA;
                    });
                }

                monitoringList.innerHTML = '';
                if (processesToDisplay.length === 0) {
                    monitoringList.innerHTML = '<tr><td colspan="6" class="text-center">No matching processes found.</td></tr>';
                    return;
                }
                processesToDisplay.forEach(proc => {
                    if (!childProcessIds.has(proc.id)) renderProcessRow(proc);
                });
                updateTimedElements();
            };

            const renderProcessRow = (proc) => {
                const status = calculatedProcessStates.get(proc.id) || 'POR INICIAR';
                const rowClass = getRowClass(status);
                const isExpandable = (proc.mode === 'Multiple' && proc.internalPhases.length > 1) || (proc.childProcesses && proc.childProcesses.length > 0);
                const collapseId = `collapse-${proc.id}`;
                const mainRow = document.createElement('tr');
                mainRow.className = rowClass;
                mainRow.setAttribute('data-process-id', proc.id);
                const badgeClass = `badge-${status.toLowerCase().replace(/\s+/g, '-')}`;
                mainRow.innerHTML = `
                    <td>
                        <button class="btn btn-sm btn-light me-2 expand-btn" data-bs-toggle="collapse" href="#${collapseId}" role="button" style="visibility: ${isExpandable ? 'visible' : 'hidden'};">▶</button>
                        ${proc.name}
                    </td>
                    <td>${proc.startTime}</td>
                    <td>${proc.endTime}</td>
                    <td><span class="badge ${badgeClass}">${status.toUpperCase()}</span></td>
                    <td class="spinner-cell"><div class="spinner-grow spinner-grow-sm text-secondary" role="status"></div></td>
                    <td><button class="btn btn-primary btn-sm register-btn" ${isExpandable ? 'disabled' : ''}>Registrar</button></td>
                `;
                monitoringList.appendChild(mainRow);
                if (isExpandable) {
                    const detailRow = document.createElement('tr');
                    const detailCell = document.createElement('td');
                    detailCell.colSpan = 6;
                    detailCell.innerHTML = `<div class="collapse" id="${collapseId}"><div class="p-3">Loading details...</div></div>`;
                    detailRow.appendChild(detailCell);
                    monitoringList.appendChild(detailRow);
                }
            };

            const getRowClass = (status) => {
                const s = status.toLowerCase();
                if (s === 'ok') return 'table-success';
                if (s === 'falla' || s === 'error') return 'table-danger';
                if (s === 'ambar') return 'table-warning';
                if (s === 'sin ejecucion') return 'table-secondary';
                return '';
            };

            const fetchAndRenderAll = () => {
                if (!companyId) return;
                Promise.all([
                    fetch(`/api/processes?companyId=${companyId}`).then(res => res.json()),
                    fetch(`/api/registrations?companyId=${companyId}`).then(res => res.json()),
                    fetchUsers()
                ]).then(([processes, registrations]) => {
                    masterProcessList = processes;
                    allRegistrations = registrations;
                    calculateProcessStates(processes, registrations);
                    displayProcesses();
                }).catch(error => console.error('Error fetching data:', error));
            };

            const fetchUsers = () => fetch(`/api/users?companyId=${companyId}`).then(res => res.ok ? res.json() : []).then(data => { userList = data; }).catch(() => { userList = []; });

            const updateTimedElements = () => {
                const now = new Date();
                const currentTime = now.getHours() * 60 + now.getMinutes();
                const processMap = new Map(masterProcessList.map(p => [p.id, p]));

                const isInTimeWindow = (proc) => {
                    if (!proc || !proc.startTime || !proc.endTime) return false;
                    const startTime = parseInt(proc.startTime.replace(':', ''), 10);
                    const endTime = parseInt(proc.endTime.replace(':', ''), 10);
                    const startMinutes = Math.floor(startTime / 100) * 60 + (startTime % 100);
                    const endMinutes = Math.floor(endTime / 100) * 60 + (endTime % 100);
                    return currentTime >= startMinutes && currentTime < endMinutes;
                };

                document.querySelectorAll('tr[data-process-id]').forEach(row => {
                    const procId = row.dataset.processId;
                    const proc = processMap.get(procId);
                    if (!proc) return;

                    const registerBtn = row.querySelector('.register-btn');
                    const spinner = row.querySelector('.spinner-grow');
                    const inTime = isInTimeWindow(proc);

                    if (registerBtn) {
                        registerBtn.disabled = !inTime;
                    }

                    if (spinner) {
                        const startTime = parseInt(proc.startTime.replace(':', ''), 10);
                        const endTime = parseInt(proc.endTime.replace(':', ''), 10);
                        const startMinutes = Math.floor(startTime / 100) * 60 + (startTime % 100);
                        const endMinutes = Math.floor(endTime / 100) * 60 + (endTime % 100);
                        const totalDuration = endMinutes - startMinutes;
                        const elapsedTime = currentTime - startMinutes;
                        const percentage = totalDuration > 0 ? (elapsedTime / totalDuration) * 100 : 0;
                        spinner.className = 'spinner-grow spinner-grow-sm';
                        if (!inTime) spinner.classList.add('text-secondary');
                        else if (percentage < 50) spinner.classList.add('text-success');
                        else if (percentage < 67) spinner.classList.add('text-warning');
                        else spinner.classList.add('text-danger');
                    }
                });

                document.querySelectorAll('.collapse.show').forEach(detailView => {
                    const parentProcId = detailView.id.replace('collapse-', '');
                    const parentProc = processMap.get(parentProcId);
                    if (!parentProc) return;

                    const isParentInTime = isInTimeWindow(parentProc);

                    let lastPhaseStatusOk = true;
                    if (parentProc.mode === 'Multiple') {
                        parentProc.internalPhases.forEach(phase => {
                            const phaseBtn = detailView.querySelector(`[data-phase-name="${phase.name}"]`);
                            if (phaseBtn) {
                                phaseBtn.disabled = !lastPhaseStatusOk || !isParentInTime;
                                const phaseRegistrations = allRegistrations.filter(r => r.processId === parentProcId && r.phase === phase.name);
                                if (phaseRegistrations.length > 0) {
                                    const latestStatus = phaseRegistrations.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))[0].values.find(v=>v.name==='Status')?.value || '';
                                    lastPhaseStatusOk = latestStatus.toLowerCase() === 'ok';
                                } else {
                                    lastPhaseStatusOk = false;
                                }
                            }
                        });
                    }

                    if (parentProc.childProcesses && parentProc.childProcesses.length > 0) {
                        parentProc.childProcesses.forEach(childId => {
                            const childProc = processMap.get(childId);
                            const childBtn = detailView.querySelector(`button.register-child-btn[data-process-id="${childId}"]`);
                            if (childProc && childBtn) {
                                childBtn.disabled = !(isInTimeWindow(childProc) && isParentInTime);
                            }
                        });
                    }
                });
            };

            monitoringList.addEventListener('show.bs.collapse', event => {
                const detailDiv = event.target.querySelector('.p-3');
                const processId = event.target.id.replace('collapse-', '');
                const proc = masterProcessList.find(p => p.id === processId);
                if (!proc) { detailDiv.innerHTML = 'Error.'; return; }

                // Priority 1: Show linked children if they exist.
                if (proc.childProcesses && proc.childProcesses.length > 0) {
                    detailDiv.innerHTML = renderChildProcessesDetails(proc);
                // Priority 2: Show internal phases if it's a multi-phase process.
                } else if (proc.mode === 'Multiple' && proc.internalPhases.length > 1) {
                    detailDiv.innerHTML = renderInternalPhasesDetails(proc);
                } else {
                    detailDiv.innerHTML = 'No further details for this process.';
                }
            });

            const renderInternalPhasesDetails = (proc) => {
                let html = '<ul class="list-group list-group-flush">';
                proc.internalPhases.forEach(phase => {
                    const phaseRegistrations = allRegistrations.filter(r => r.processId === proc.id && r.phase === phase.name).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
                    const lastStatus = phaseRegistrations.length > 0 ? (phaseRegistrations[0].values.find(v=>v.name==='Status')?.value || 'N/A') : 'N/A';
                    const badgeClass = `badge-${lastStatus.toLowerCase().replace(/\s+/g, '-')}`;
                    html += `<li class="list-group-item d-flex justify-content-between align-items-center">
                        <span>${phase.name} <span class="badge ${badgeClass} ms-2">${lastStatus.toUpperCase()}</span></span>
                        <button class="btn btn-outline-primary btn-sm register-phase-btn" data-process-id="${proc.id}" data-phase-name="${phase.name}">Registrar</button>
                    </li>`;
                });
                return html + '</ul>';
            };

            const renderChildProcessesDetails = (proc) => {
                const processMap = new Map(masterProcessList.map(p => [p.id, p]));
                let html = '<ul class="list-group list-group-flush">';
                proc.childProcesses.forEach(childId => {
                    const childProc = processMap.get(childId);
                    if (childProc) {
                        const status = calculatedProcessStates.get(childId) || 'POR INICIAR';
                        const badgeClass = `badge-${status.toLowerCase().replace(/\s+/g, '-')}`;
                        html += `
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <div>
                                    <span>${childProc.name}</span>
                                    <small class="text-muted d-block">${childProc.startTime} - ${childProc.endTime}</small>
                                </div>
                                <div>
                                    <span class="badge ${badgeClass} me-2">${status.toUpperCase()}</span>
                                    <button class="btn btn-outline-primary btn-sm register-child-btn" data-process-id="${childId}">Registrar</button>
                                </div>
                            </li>`;
                    }
                });
                return html + '</ul>';
            };

            const openRegistrationModal = (proc, phaseName = null) => {
                currentProcessId = proc.id;
                currentPhaseName = phaseName || (proc.mode === 'Individual' ? proc.internalPhases[0]?.name : null);
                modalProcessName.textContent = phaseName ? `${proc.name} - ${phaseName}` : proc.name;
                modalStartTime.textContent = proc.startTime;
                modalEndTime.textContent = proc.endTime;
                modalRegistrationForm.innerHTML = '';
                const phase = proc.internalPhases.find(p => p.name === currentPhaseName) || { fields: [] };

                if (phase.fields.length > 0) {
                    phase.fields.forEach(field => {
                        const fieldId = `field-${field.name.replace(/\s+/g, '-')}`;
                        let inputHtml;
                        switch (field.type) {
                            case 'status':
                                const statusOptions = ['falla', 'ambar', 'ok', 'error', 'sin ejecucion'];
                                inputHtml = `<select id="${fieldId}" class="form-select" data-field-name="${field.name}">${statusOptions.map(opt => `<option value="${opt}">${opt.charAt(0).toUpperCase() + opt.slice(1)}</option>`).join('')}</select>`;
                                break;
                            case 'responsable':
                                const userOptions = userList.map(user => `<option value="${user.name}">${user.name}</option>`).join('');
                                inputHtml = `<select id="${fieldId}" class="form-select" data-field-name="${field.name}"><option selected>Choose...</option>${userOptions}</select>`;
                                break;
                            default:
                                inputHtml = `<input type="text" id="${fieldId}" class="form-control" data-field-name="${field.name}">`;
                        }
                        modalRegistrationForm.innerHTML += `<div class="row mb-3"><label for="${fieldId}" class="col-sm-4 col-form-label">${field.name}</label><div class="col-sm-8">${inputHtml}</div></div>`;
                    });
                } else {
                    modalRegistrationForm.innerHTML = '<p>No fields defined.</p>';
                }
                registrationModal.show();
            };

            monitoringList.addEventListener('click', (e) => {
                const target = e.target;
                let proc;
                if (target.classList.contains('register-btn')) {
                    proc = masterProcessList.find(p => p.id === target.closest('tr').dataset.processId);
                    if (proc) openRegistrationModal(proc);
                } else if (target.classList.contains('register-phase-btn')) {
                    proc = masterProcessList.find(p => p.id === target.dataset.processId);
                    if (proc) openRegistrationModal(proc, target.dataset.phaseName);
                } else if (target.classList.contains('register-child-btn')) {
                    proc = masterProcessList.find(p => p.id === target.dataset.processId);
                    if (proc) openRegistrationModal(proc);
                }
            });

            saveRegistrationBtn.addEventListener('click', () => {
                const values = [];
                modalRegistrationForm.querySelectorAll('[data-field-name]').forEach(input => {
                    values.push({ name: input.dataset.fieldName, value: input.value });
                });
                const registrationData = { companyId, processId: currentProcessId, timestamp: new Date().toISOString(), phase: currentPhaseName, values };
                fetch('/api/registrations', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(registrationData) })
                .then(res => res.ok ? res.json() : Promise.reject('Failed to save'))
                .then(() => { registrationModal.hide(); fetchAndRenderAll(); })
                .catch(err => { console.error(err); alert('Error saving.'); });
            });

            updateMenuLinks(companyId);
            fetchAndRenderAll();
            setInterval(fetchAndRenderAll, 30000);
            document.getElementById('filter-name').addEventListener('input', displayProcesses);
            document.getElementById('filter-status').addEventListener('change', displayProcesses);
            sortTimeButton.addEventListener('click', () => {
                sortTimeButton.dataset.sortOrder = sortTimeButton.dataset.sortOrder === 'asc' ? 'desc' : 'asc';
                displayProcesses();
            });
        });
    </script>
</body>
</html>
