<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Monitoring</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-ok { color: #198754; font-weight: bold; }
        .status-falla, .status-error { color: #dc3545; font-weight: bold; }
        .status-ambar { color: #ffc107; font-weight: bold; }
        .status-sin-ejecucion { color: #6c757d; font-weight: bold; }
        .status-por-iniciar { color: #adb5bd; }

        .badge-ok { background-color: #198754; }
        .badge-falla, .badge-error { background-color: #dc3545; }
        .badge-ambar { background-color: #ffc107; color: #000; }
        .badge-sin-ejecucion { background-color: #6c757d; }
        .badge-por-iniciar { background-color: #adb5bd; }

        .badge { font-size: 0.9em; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu" aria-controls="offcanvasMenu">
                Menu
            </button>
            <a class="navbar-brand" href="#">
                <img src="logo.png" alt="Avatar Logo" style="width:40px;" class="rounded-pill">
            </a>
        </div>
    </nav>
    <!-- Offcanvas Menu -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu" aria-labelledby="offcanvasMenuLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasMenuLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="/dashboard.html" class="nav-link" id="menu-dashboard">Dashboard</a>
                </li>
                <li>
                    <a href="/users.html" class="nav-link text-dark" id="menu-users">Users</a>
                </li>
                <li>
                    <a href="/selection.html" class="nav-link text-dark">Companies</a>
                </li>
                <li>
                    <a href="/departments.html" class="nav-link text-dark" id="menu-departments">Departments</a>
                </li>
                <li>
                    <a href="/processes.html" class="nav-link text-dark" id="menu-processes">Processes</a>
                </li>
                <li>
                    <a href="/monitoring.html" class="nav-link text-dark" id="menu-monitoring">Monitoring</a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container mt-4">
        <h1 class="mb-4">Process Monitoring</h1>

        <div class="row mb-3 gx-2">
            <div class="col-md-5">
                <input type="text" id="filter-name" class="form-control" placeholder="Filter by process name...">
            </div>
            <div class="col-md-4">
                <select id="filter-status" class="form-select">
                    <option value="">All Statuses</option>
                    <option value="ok">OK</option>
                    <option value="falla">Falla</option>
                    <option value="error">Error</option>
                    <option value="ambar">Ambar</option>
                    <option value="sin ejecucion">Sin Ejecucion</option>
                    <option value="POR INICIAR">Por Iniciar</option>
                </select>
            </div>
            <div class="col-md-3">
                <button id="sort-time" class="btn btn-outline-secondary w-100">Sort by Time</button>
            </div>
        </div>

        <table class="table table-hover">
            <thead class="table-light">
                <tr>
                    <th>PROCESO</th>
                    <th>INICIO</th>
                    <th>FIN</th>
                    <th>ESTATUS</th>
                    <th>URGENCIA</th>
                    <th>ACCIONES</th>
                </tr>
            </thead>
            <tbody id="monitoring-list">
                <!-- Process rows will be inserted here by JavaScript -->
            </tbody>
        </table>
    </main>

    <!-- Registration Modal -->
    <div class="modal fade" id="registrationModal" tabindex="-1" aria-labelledby="registrationModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header" style="background-color: #343a40; color: white;">
                    <h5 class="modal-title" id="registrationModalLabel">Crear Registro</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="process-info-bar mb-3 p-2 rounded" style="background-color: #e9ecef;">
                        <div class="d-flex justify-content-between">
                            <div><strong>Proceso:</strong> <span id="modal-process-name"></span></div>
                            <div>
                                <strong>Hora Inicio:</strong> <span id="modal-start-time"></span>
                                <strong class="ms-4">Hora Fin:</strong> <span id="modal-end-time"></span>
                            </div>
                        </div>
                    </div>
                    <form id="modal-registration-form">
                        <!-- Dynamic form fields will be injected here by JS -->
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary">Guardar Registro</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const monitoringList = document.getElementById('monitoring-list');
            const menu = document.getElementById('offcanvasMenu');
            const urlParams = new URLSearchParams(window.location.search);
            const companyId = urlParams.get('companyId') || 'default'; // Using a default for now
            const registrationModal = new bootstrap.Modal(document.getElementById('registrationModal'));
            const modalProcessName = document.getElementById('modal-process-name');
            const modalStartTime = document.getElementById('modal-start-time');
            const modalEndTime = document.getElementById('modal-end-time');
            const modalRegistrationForm = document.getElementById('modal-registration-form');
            const saveRegistrationBtn = document.querySelector('#registrationModal .btn-primary');
            const sortTimeButton = document.getElementById('sort-time');
            let userList = []; // To store users for the dropdown
            let currentProcessId = null; // To store the process ID for saving
            let currentRegistrationId = null; // To store the registration ID for editing
            let isEditMode = false; // To track if the modal is for editing or creating
            let masterProcessList = []; // To hold the original, full list of processes

            // --- Menu Logic ---
            const updateMenuLinks = (id) => {
                if (!id) return;
                menu.querySelector('#menu-dashboard').href = `dashboard.html?companyId=${id}`;
                menu.querySelector('#menu-users').href = `users.html?companyId=${id}`;
                menu.querySelector('#menu-departments').href = `departments.html?companyId=${id}`;
                menu.querySelector('#menu-processes').href = `processes.html?companyId=${id}`;
                menu.querySelector('#menu-monitoring').href = `monitoring.html?companyId=${id}`;

                const currentPage = window.location.pathname;
                if (currentPage.includes('monitoring.html')) {
                    menu.querySelector('#menu-monitoring').classList.add('active');
                }
            };

            // --- Page Logic ---
            const displayProcesses = () => {
                const nameFilter = document.getElementById('filter-name').value.toLowerCase();
                const statusFilter = document.getElementById('filter-status').value;

                let processesToDisplay = [...masterProcessList];

                // Apply filters
                if (nameFilter) {
                    processesToDisplay = processesToDisplay.filter(p => p.name.toLowerCase().includes(nameFilter));
                }
                if (statusFilter) {
                    processesToDisplay = processesToDisplay.filter(p => p.status === statusFilter);
                }

                // Apply sorting only if the button has been clicked
                if (sortTimeButton.dataset.sortOrder) {
                    const sortOrder = sortTimeButton.dataset.sortOrder;
                    processesToDisplay.sort((a, b) => {
                        const timeA = parseInt(a.startTime.replace(':', ''), 10);
                        const timeB = parseInt(b.startTime.replace(':', ''), 10);
                        return sortOrder === 'asc' ? timeA - timeB : timeB - timeA;
                    });
                }

                monitoringList.innerHTML = '';
                if (processesToDisplay.length === 0) {
                    monitoringList.innerHTML = '<tr><td colspan="6" class="text-center">No matching processes found.</td></tr>';
                    return;
                }

                processesToDisplay.forEach(proc => {
                    const row = document.createElement('tr');
                    row.setAttribute('data-process-id', proc.id); // For the timer
                    const status = proc.status || 'POR INICIAR';
                    const statusClass = `status-${status.toLowerCase().replace(/\s+/g, '-')}`;
                    const badgeClass = `badge-${status.toLowerCase().replace(/\s+/g, '-')}`;

                    const fieldsData = JSON.stringify(proc.values || []);

                    row.innerHTML = `
                        <td class="${statusClass}">${proc.name}</td>
                        <td>${proc.startTime}</td>
                        <td>${proc.endTime}</td>
                        <td><span class="badge ${badgeClass}">${status.toUpperCase()}</span></td>
                        <td class="spinner-cell">
                            <div class="spinner-grow spinner-grow-sm text-secondary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </td>
                        <td>
                            ${proc.registrationId ? `
                                <button class="btn btn-warning btn-sm edit-btn"
                                    data-bs-toggle="modal"
                                    data-bs-target="#registrationModal"
                                    data-process-id="${proc.id}"
                                    data-registration-id="${proc.registrationId}"
                                    data-registration-timestamp="${proc.registrationTimestamp}"
                                    ${(new Date() - new Date(proc.registrationTimestamp)) / (1000 * 60 * 60) > 24 ? 'disabled' : ''}
                                    data-process-name="${proc.name}"
                                    data-start-time="${proc.startTime}"
                                    data-end-time="${proc.endTime}"
                                    data-fields='${fieldsData}'>
                                    Editar
                                </button>
                            ` : `
                                <button class="btn btn-primary btn-sm register-btn"
                                    data-bs-toggle="modal"
                                    data-bs-target="#registrationModal"
                                    data-process-id="${proc.id}"
                                    data-process-name="${proc.name}"
                                    data-start-time="${proc.startTime}"
                                    data-end-time="${proc.endTime}"
                                    data-fields='${fieldsData}'>
                                    Registrar
                                </button>
                            `}
                        </td>
                    `;
                    monitoringList.appendChild(row);
                });
                updateTimedElements(); // Refresh timers after rendering
            };

            const fetchAndRenderProcesses = () => {
                return fetch(`/api/processes?companyId=${companyId}`)
                    .then(response => {
                        if (!response.ok) throw new Error('Failed to fetch processes');
                        return response.json();
                    })
                    .then(processes => {
                        masterProcessList = processes;
                        displayProcesses();
                    })
                    .catch(error => {
                        console.error('Error fetching processes:', error);
                        monitoringList.innerHTML = '<tr><td colspan="6" class="text-center">Error loading processes.</td></tr>';
                    });
            };

            // --- Data Fetching ---
            const fetchUsers = () => {
                if (!companyId) return Promise.resolve();
                return fetch(`/api/users?companyId=${companyId}`)
                    .then(response => {
                        if (!response.ok) throw new Error('Failed to fetch users');
                        return response.json();
                    })
                    .then(data => {
                        userList = data; // Cache the user list
                    })
                    .catch(error => {
                        console.error('Error fetching users:', error);
                        userList = []; // Ensure it's an empty array on error
                    });
            };

            // --- Time-based UI Updates ---
            const updateTimedElements = () => {
                const now = new Date();
                const currentTime = now.getHours() * 60 + now.getMinutes();

                document.querySelectorAll('#monitoring-list tr').forEach(row => {
                    const startTimeStr = row.cells[1].textContent;
                    const endTimeStr = row.cells[2].textContent;
                    const registerBtn = row.querySelector('.register-btn');
                    const spinner = row.querySelector('.spinner-grow');

                    if (!startTimeStr || !endTimeStr || !registerBtn || !spinner) return;

                    const [startH, startM] = startTimeStr.split(':').map(Number);
                    const [endH, endM] = endTimeStr.split(':').map(Number);
                    const startTime = startH * 60 + startM;
                    const endTime = endH * 60 + endM;

                    // Button enable/disable logic
                    if (currentTime >= startTime && currentTime < endTime) {
                        registerBtn.disabled = false;
                    } else {
                        registerBtn.disabled = true;
                    }

                    // Spinner color logic
                    const totalDuration = endTime - startTime;
                    const elapsedTime = currentTime - startTime;
                    const percentage = totalDuration > 0 ? (elapsedTime / totalDuration) * 100 : 0;

                    spinner.className = 'spinner-grow spinner-grow-sm'; // Reset classes
                    if (currentTime < startTime || currentTime >= endTime) {
                        spinner.classList.add('text-secondary'); // Off
                    } else if (percentage < 50) { // 01:00 to 01:29 for a 1h window
                        spinner.classList.add('text-success'); // Green
                    } else if (percentage < 67) { // 01:30 to 01:40 for a 1h window (approx 66.6%)
                        spinner.classList.add('text-warning'); // Yellow
                    } else { // 01:41 to 02:00
                        spinner.classList.add('text-danger'); // Red
                    }
                });
            };

            // --- Initial Load ---
            updateMenuLinks(companyId);
            fetchAndRenderProcesses().then(() => {
                // The interval is now started after the first fetch completes
                setInterval(updateTimedElements, 30000);
            });
            fetchUsers(); // Fetch users once on page load

            // --- Filter and Sort Event Listeners ---
            document.getElementById('filter-name').addEventListener('input', displayProcesses);
            document.getElementById('filter-status').addEventListener('change', displayProcesses);
            sortTimeButton.addEventListener('click', () => {
                const currentOrder = sortTimeButton.dataset.sortOrder;
                const nextOrder = currentOrder === 'asc' ? 'desc' : 'asc';
                sortTimeButton.dataset.sortOrder = nextOrder;
                displayProcesses();
            });

            // --- Modal Logic ---
            document.getElementById('registrationModal').addEventListener('show.bs.modal', function (event) {
                const button = event.relatedTarget;
                isEditMode = button.classList.contains('edit-btn');

                currentProcessId = button.getAttribute('data-process-id');
                currentRegistrationId = isEditMode ? button.getAttribute('data-registration-id') : null;

                const processName = button.getAttribute('data-process-name');
                const startTime = button.getAttribute('data-start-time');
                const endTime = button.getAttribute('data-end-time');
                const fieldsString = button.getAttribute('data-fields');
                const fields = fieldsString ? JSON.parse(fieldsString) : [];

                const modalTitle = document.getElementById('registrationModalLabel');
                modalTitle.textContent = isEditMode ? 'Editar Registro' : 'Crear Registro';

                // Populate modal header
                modalProcessName.textContent = processName;
                modalStartTime.textContent = startTime;
                modalEndTime.textContent = endTime;

                // Populate modal body with a dynamic form
                modalRegistrationForm.innerHTML = '';
                if (fields.length > 0) {
                    fields.forEach(field => {
                        const formRow = document.createElement('div');
                        formRow.className = 'row mb-3 align-items-center';
                        let inputHtml = '';
                        const fieldId = `field-${field.name.replace(/\s+/g, '-')}`;
                        // ... (form generation logic remains the same)
                        switch (field.type) {
                            case 'status':
                                const statusOptions = ['falla', 'ambar', 'ok', 'error', 'sin ejecucion'];
                                inputHtml = `<select id="${fieldId}" class="form-select" data-field-name="${field.name}">
                                    <option selected>Choose...</option>
                                    ${statusOptions.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                                </select>`;
                                break;
                            case 'responsable':
                                const userOptions = userList.map(user => `<option value="${user.name}">${user.name}</option>`).join('');
                                inputHtml = `<select id="${fieldId}" class="form-select" data-field-name="${field.name}">
                                    <option selected>Choose...</option>
                                    ${userOptions}
                                </select>`;
                                break;
                            case 'number':
                                inputHtml = `<input type="number" id="${fieldId}" class="form-control" data-field-name="${field.name}">`;
                                break;
                            case 'date':
                                inputHtml = `<input type="date" id="${fieldId}" class="form-control" data-field-name="${field.name}">`;
                                break;
                            default:
                                inputHtml = `<input type="text" id="${fieldId}" class="form-control" data-field-name="${field.name}">`;
                                break;
                        }
                        formRow.innerHTML = `
                            <label for="${fieldId}" class="col-sm-4 col-form-label">${field.name}</label>
                            <div class="col-sm-8">${inputHtml}</div>`;
                        modalRegistrationForm.appendChild(formRow);
                    });
                } else {
                    modalRegistrationForm.innerHTML = '<p class="text-center">No registration fields defined for this process.</p>';
                }

                if (isEditMode) {
                    // Fetch the existing registration data and populate the form
                    fetch(`/api/registrations/${currentRegistrationId}?companyId=${companyId}`)
                        .then(res => res.json())
                        .then(registration => {
                            (registration.values || []).forEach(regValue => {
                                const fieldInput = modalRegistrationForm.querySelector(`[data-field-name="${regValue.name}"]`);
                                if (fieldInput) {
                                    fieldInput.value = regValue.value;
                                }
                            });
                        })
                        .catch(err => console.error('Failed to fetch registration details:', err));
                }
            });

            saveRegistrationBtn.addEventListener('click', () => {
                if (!confirm('¿Desea guardar el resultado?')) {
                    return;
                }

                const values = [];
                const inputs = modalRegistrationForm.querySelectorAll('input, select');
                inputs.forEach(input => {
                    const fieldName = input.getAttribute('data-field-name');
                    if (fieldName) {
                        values.push({ name: fieldName, value: input.value });
                    }
                });

                const url = isEditMode ? `/api/registrations/${currentRegistrationId}` : '/api/registrations';
                const method = isEditMode ? 'PUT' : 'POST';
                const body = isEditMode
                    ? JSON.stringify({ companyId: companyId, values: values })
                    : JSON.stringify({ companyId: companyId, processId: currentProcessId, timestamp: new Date().toISOString(), values: values });

                fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: body
                })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => { throw new Error(err.error || 'Failed to save registration') });
                    }
                    return response.json();
                })
                .then(() => {
                    registrationModal.hide();
                    fetchAndRenderProcesses();
                })
                .catch(error => {
                    console.error('Error saving registration:', error);
                    alert(`Error: ${error.message}`);
                });
            });
        });
    </script>
</body>
</html>
