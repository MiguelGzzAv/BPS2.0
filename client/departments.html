<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu">Menu</button>
            <a class="navbar-brand ms-3" href="#">
                <img src="logo.png" alt="Avatar Logo" style="width:40px;" class="rounded-pill">
            </a>
            <div class="ms-auto">
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </nav>
    <!-- Offcanvas Menu -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item"><a href="#" class="nav-link text-dark" id="menu-dashboard">Dashboard</a></li>
                <li><a href="#" class="nav-link text-dark" id="menu-users">Users</a></li>
                <li><a href="/selection.html" class="nav-link text-dark">Companies</a></li>
                <li><a href="#" class="nav-link" id="menu-departments">Departments</a></li>
                <li><a href="#" class="nav-link text-dark" id="menu-processes">Processes</a></li>
                <li><a href="#" class="nav-link text-dark" id="menu-monitoring">Monitoring</a></li>
                <li><a href="#" class="nav-link text-dark" id="menu-escalation">Escalation</a></li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container mt-4">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1 id="header-title">Department Management</h1>
            <button id="add-department-btn" class="btn btn-primary" style="display: none;">Add Department</button>
        </header>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Department Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="department-list">
                <!-- Rows injected by JS -->
            </tbody>
        </table>
    </main>

    <!-- Add Department Modal -->
    <div class="modal fade" id="addDepartmentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Department</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-department-form">
                        <div class="mb-3">
                            <label for="department-name" class="form-label">Department Name</label>
                            <input type="text" class="form-control" id="department-name" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" form="add-department-form" class="btn btn-primary">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            protectPage();
            const user = getLoggedInUser();
            const companyId = sessionStorage.getItem('selectedCompanyId');
            const companyName = sessionStorage.getItem('selectedCompanyName');

            if (!companyId) {
                alert('No company selected. Redirecting...');
                window.location.href = '/selection.html';
                return;
            }

            // --- Elements ---
            const departmentList = document.getElementById('department-list');
            const addDepartmentBtn = document.getElementById('add-department-btn');
            const addDepartmentForm = document.getElementById('add-department-form');
            const logoutBtn = document.getElementById('logout-btn');
            const addDepartmentModal = new bootstrap.Modal(document.getElementById('addDepartmentModal'));

            // --- UI Setup ---
            document.getElementById('header-title').textContent = `Departments - ${companyName}`;
            logoutBtn.addEventListener('click', logout);

            if (user.role === 'admin' || user.role === 'superadmin') {
                addDepartmentBtn.style.display = 'block';
            }

            const updateMenuLinks = () => {
                const menu = document.getElementById('offcanvasMenu');
                menu.querySelector('#menu-dashboard').href = `dashboard.html`;
                menu.querySelector('#menu-users').href = `users.html`;
                menu.querySelector('#menu-departments').href = `departments.html`;
                menu.querySelector('#menu-processes').href = `processes.html`;
                menu.querySelector('#menu-monitoring').href = `monitoring.html`;
                menu.querySelector('#menu-escalation').href = `escalation.html`;
                menu.querySelector('#menu-departments').classList.add('active');
            };

            // --- Data Functions ---
            const renderDepartments = (departments) => {
                departmentList.innerHTML = '';
                if (!departments || departments.length === 0) {
                    departmentList.innerHTML = '<tr><td colspan="2">No departments found.</td></tr>';
                    return;
                }
                departments.forEach(dept => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${dept.name}</td>
                        <td>
                            <button class="btn btn-sm btn-warning" disabled>Edit</button>
                            <button class="btn btn-sm btn-danger" disabled>Delete</button>
                        </td>
                    `;
                    departmentList.appendChild(row);
                });
            };

            const fetchAndRenderDepartments = async () => {
                let url = '/api/departments';
                if (user.role === 'superadmin') {
                    url += `?companyId=${companyId}`;
                }
                try {
                    const response = await fetchWithAuth(url);
                    const departments = await response.json();
                    renderDepartments(departments);
                } catch (error) {
                    console.error('Error fetching departments:', error);
                    departmentList.innerHTML = '<tr><td colspan="2" class="text-danger">Error loading departments.</td></tr>';
                }
            };

            // --- Event Listeners ---
            addDepartmentBtn.addEventListener('click', () => {
                addDepartmentForm.reset();
                addDepartmentModal.show();
            });

            addDepartmentForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                const departmentName = document.getElementById('department-name').value.trim();
                if (!departmentName) return;

                const newDepartment = { name: departmentName };
                if (user.role === 'superadmin') {
                    newDepartment.companyId = companyId;
                }

                try {
                    await fetchWithAuth('/api/departments', {
                        method: 'POST',
                        body: JSON.stringify(newDepartment)
                    });
                    addDepartmentModal.hide();
                    fetchAndRenderDepartments();
                } catch (error) {
                    console.error('Error adding department:', error);
                    alert('Failed to add department.');
                }
            });

            // --- Initial Load ---
            updateMenuLinks();
            fetchAndRenderDepartments();
        });
    </script>
</body>
</html>
