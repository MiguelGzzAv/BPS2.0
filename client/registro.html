<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .header-bar {
            background-color: #343a40;
            color: white;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .process-info-bar {
            background-color: #e9ecef;
            padding: 1rem;
            border-radius: 0.25rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .table-responsive {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <!-- Offcanvas Menu -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu" aria-labelledby="offcanvasMenuLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasMenuLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="/dashboard.html" class="nav-link" id="menu-dashboard">Dashboard</a>
                </li>
                <li>
                    <a href="/users.html" class="nav-link text-dark" id="menu-users">Users</a>
                </li>
                <li>
                    <a href="/selection.html" class="nav-link text-dark">Companies</a>
                </li>
                <li>
                    <a href="/departments.html" class="nav-link text-dark" id="menu-departments">Departments</a>
                </li>
                <li>
                    <a href="/processes.html" class="nav-link text-dark" id="menu-processes">Processes</a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container-fluid mt-4">
        <header class="d-flex align-items-center mb-4">
             <button class="btn btn-primary me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu" aria-controls="offcanvasMenu">
                Menu
            </button>
            <div>
                <h1 class="d-inline-block align-middle" style="color: #6c757d;">Registros</h1>
            </div>
        </header>

        <div class="header-bar">
            <h2>Crear Registro</h2>
        </div>

        <div class="process-info-bar">
            <div>
                <strong>Proceso:</strong> <span id="process-name"></span>
            </div>
            <div>
                <strong>Hora Inicio:</strong> <span id="process-startTime"></span>
                <strong class="ms-4">Hora Fin:</strong> <span id="process-endTime"></span>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered">
                <thead class="table-light">
                    <tr>
                        <th>MODULO</th>
                        <th>SISTEMA ORIGEN</th>
                        <th>FECHA PROCESO</th>
                        <th>HORA PROCESO</th>
                        <th>MENSAJE_ERROR</th>
                        <th>ESTATUS</th>
                    </tr>
                </thead>
                <tbody id="registration-fields-body">
                    <!-- Dynamic rows will be inserted here -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const companyId = urlParams.get('companyId');
            const processId = urlParams.get('processId');
            const menu = document.getElementById('offcanvasMenu');

            // --- Menu Logic ---
            const updateMenuLinks = (id) => {
                if (!id) return;
                menu.querySelector('#menu-dashboard').href = `dashboard.html?companyId=${id}`;
                menu.querySelector('#menu-users').href = `users.html?companyId=${id}`;
                menu.querySelector('#menu-departments').href = `departments.html?companyId=${id}`;
                menu.querySelector('#menu-processes').href = `processes.html?companyId=${id}`;

                 // Set active class for processes
                 const currentPage = window.location.pathname;
                if (currentPage.includes('processes.html') || currentPage.includes('registro.html')) {
                    menu.querySelector('#menu-processes').classList.add('active');
                    menu.querySelector('#menu-processes').classList.remove('text-dark');
                }
            };

            // --- Page Logic ---
            const processNameEl = document.getElementById('process-name');
            const processStartTimeEl = document.getElementById('process-startTime');
            const processEndTimeEl = document.getElementById('process-endTime');
            const registrationFieldsBody = document.getElementById('registration-fields-body');

            const renderRegistrationFields = (process) => {
                // Populate header
                processNameEl.textContent = process.name || 'N/A';
                processStartTimeEl.textContent = process.startTime || 'N/A';
                processEndTimeEl.textContent = process.endTime || 'N/A';

                // Populate table
                registrationFieldsBody.innerHTML = '';
                if (process.values && process.values.length > 0) {
                    process.values.forEach(field => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>
                                <input type="text" class="form-control" value="${field.name}" readonly>
                            </td>
                            <td><input type="text" class="form-control"></td>
                            <td><input type="date" class="form-control"></td>
                            <td><input type="time" class="form-control"></td>
                            <td><input type="text" class="form-control"></td>
                            <td>
                                <select class="form-select">
                                    <option selected>Choose...</option>
                                    <option value="Success">Success</option>
                                    <option value="Failed">Failed</option>
                                    <option value="Pending">Pending</option>
                                </select>
                            </td>
                        `;
                        registrationFieldsBody.appendChild(row);
                    });
                } else {
                    registrationFieldsBody.innerHTML = '<tr><td colspan="6" class="text-center">No registration fields defined for this process.</td></tr>';
                }
            };

            const fetchProcessDetails = () => {
                if (!companyId || !processId) {
                    processNameEl.textContent = 'Error: Company ID or Process ID is missing.';
                    return;
                }
                // Assumes an API that can fetch all processes for a company
                // and then we filter by ID client-side.
                // A more direct API /api/processes/${processId} would be better.
                fetch(`/api/processes?companyId=${companyId}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(processes => {
                        const process = processes.find(p => p.id === processId);
                        if (process) {
                            renderRegistrationFields(process);
                        } else {
                            throw new Error('Process not found');
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching process details:', error);
                        registrationFieldsBody.innerHTML = `<tr><td colspan="6" class="text-center">Error loading process data.</td></tr>`;
                    });
            };

            // --- Initial Load ---
            updateMenuLinks(companyId);
            fetchProcessDetails();
        });
    </script>
</body>
</html>
